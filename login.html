<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | Sweety Masala</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#fff8ed;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#8b0000;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#8b0000;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#8b0000;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#a50000;
}

.forgot{
    display:block;
    text-align:right;
    margin-top:10px;
    color:#8b0000;
    cursor:pointer;
    font-size:14px;
}

.switch{
    text-align:center;
    margin-top:20px;
}

.switch span{
    color:#8b0000;
    font-weight:bold;
    cursor:pointer;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#555;
    text-decoration:none;
}

.hidden{
    display:none;
}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">
🌶️
</div>


<h1>
Sweety Masala
</h1>


<p
class="subtitle"
id="formTitle"
>
Customer Login
</p>



<!-- =========================
     LOGIN FORM
========================= -->

<div id="loginForm">


<div class="form-group">

<label>
Email
</label>

<input
type="email"
id="loginEmail"
placeholder="Apna email likhein"
>

</div>


<div class="form-group">

<label>
Password
</label>

<input
type="password"
id="loginPassword"
placeholder="Password"
>

</div>


<button
type="button"
onclick="loginUser()"
>
🔐 Login
</button>


<span
class="forgot"
onclick="forgotPassword()"
>
Forgot Password?
</span>


<div class="switch">

Account nahi hai?

<span onclick="showRegister()">
Register
</span>

</div>


</div>



<!-- =========================
     REGISTER FORM
========================= -->

<div
id="registerForm"
class="hidden"
>


<div class="form-group">

<label>
Email
</label>

<input
type="email"
id="registerEmail"
placeholder="Apna email likhein"
>

</div>


<div class="form-group">

<label>
Password
</label>

<input
type="password"
id="registerPassword"
placeholder="Kam se kam 6 characters"
>

</div>


<button
type="button"
onclick="registerUser()"
>
👤 Create Account
</button>


<div class="switch">

Already account hai?

<span onclick="showLogin()">
Login
</span>

</div>


</div>



<!-- MESSAGE -->

<div
id="message"
class="message"
>
</div>


<a
href="index.html"
class="back"
>
← Website par wapas jayein
</a>


</div>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">


import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyCl15UMUZUhnfAAHWjtyR52APgLTuVd7a0",

    authDomain:
    "sweety-masala.firebaseapp.com",

    projectId:
    "sweety-masala",

    storageBucket:
    "sweety-masala.firebasestorage.app",

    messagingSenderId:
    "152835150862",

    appId:
    "1:152835150862:web:bdd6bafcc074aeb37e585f",

    measurementId:
    "G-NQ82YZCKG3"

};



/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const messageBox =
document.getElementById("message");



/* =========================
   SHOW MESSAGE
========================= */

function showMessage(text){

    messageBox.textContent = text;

}



/* =========================
   SHOW REGISTER
========================= */

window.showRegister = function(){

    document
    .getElementById("loginForm")
    .classList
    .add("hidden");


    document
    .getElementById("registerForm")
    .classList
    .remove("hidden");


    document
    .getElementById("formTitle")
    .textContent =
    "Create Customer Account";


    showMessage("");

};



/* =========================
   SHOW LOGIN
========================= */

window.showLogin = function(){

    document
    .getElementById("registerForm")
    .classList
    .add("hidden");


    document
    .getElementById("loginForm")
    .classList
    .remove("hidden");


    document
    .getElementById("formTitle")
    .textContent =
    "Customer Login";


    showMessage("");

};



/* =========================
   REGISTER
========================= */

window.registerUser = async function(){

    const email =
    document
    .getElementById("registerEmail")
    .value
    .trim();


    const password =
    document
    .getElementById("registerPassword")
    .value;


    if(!email || !password){

        showMessage(
            "Email aur password dono likhein."
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "Password kam se kam 6 characters ka hona chahiye."
        );

        return;

    }


    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        showMessage(
            "🎉 Account successfully create ho gaya!"
        );


        setTimeout(function(){

            window.location.href =
            "index.html";

        },1200);


    }
    catch(error){

        showMessage(
            getErrorMessage(error.code)
        );

    }

};



/* =========================
   LOGIN
========================= */

window.loginUser = async function(){

    const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();


    const password =
    document
    .getElementById("loginPassword")
    .value;


    if(!email || !password){

        showMessage(
            "Email aur password dono likhein."
        );

        return;

    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        showMessage(
            "✅ Login successful!"
        );


        setTimeout(function(){

            window.location.href =
            "index.html";

        },1000);


    }
    catch(error){

        showMessage(
            getErrorMessage(error.code)
        );

    }

};



/* =========================
   FORGOT PASSWORD
========================= */

window.forgotPassword = async function(){

    const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();


    if(!email){

        showMessage(
            "Pehle apna email likhein."
        );

        return;

    }


    try{

        await sendPasswordResetEmail(
            auth,
            email
        );


        showMessage(
            "📧 Password reset email bhej diya gaya hai."
        );


    }
    catch(error){

        showMessage(
            getErrorMessage(error.code)
        );

    }

};



/* =========================
   ERROR MESSAGES
========================= */

function getErrorMessage(code){

    if(
        code ===
        "auth/email-already-in-use"
    ){

        return "Ye email already registered hai.";

    }


    if(
        code ===
        "auth/invalid-email"
    ){

        return "Email address sahi nahi hai.";

    }


    if(
        code ===
        "auth/weak-password"
    ){

        return "Password kam se kam 6 characters ka hona chahiye.";

    }


    if(
        code ===
        "auth/invalid-credential"
    ){

        return "Email ya password galat hai.";

    }


    if(
        code ===
        "auth/user-not-found"
    ){

        return "Is email se account nahi mila.";

    }


    if(
        code ===
        "auth/wrong-password"
    ){

        return "Password galat hai.";

    }


    return "Kuch problem hui. Dobara try karein.";

}


</script>


</body>

</html>
