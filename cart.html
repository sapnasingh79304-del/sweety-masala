<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff8ed;
    color:#333;
}

/* ================= HEADER ================= */

header{

.container{

    margin:30px auto;

.cart-box{
    background:white;

    0 3px 15px rgba(0,0,0,.12);
}

/* ================= CART ITEM ================= */

.cart-item{

}

/* ================= QUANTITY ================= */

.quantity{

}

.quantity button{
    width:34px;

}

.quantity button:hover{

}

    text-align:center;
}

/* ================= ITEM TOTAL ================= */

.item-total{

    cursor:pointer;
}

.remove-btn:hover{
    background:#b71c1c;
}

/* ================= EMPTY ================= */

.empty-cart{
    text-align:center;

    padding:60px 20px;
}

.empty-cart h2{
    color:#8b0000;

    margin-bottom:15px;
}

.empty-cart p{
    color:#666;

    margin-bottom:20px;
}

/* ================= SUMMARY ================= */

.summary{
    margin-top:25px;

    padding-top:20px;

    border-top:2px solid #8b0000;
}

.summary-row{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin:10px 0;

    font-size:17px;
}

.summary-row.discount{
    color:#198754;
}

.summary-total{
    display:flex;

    justify-content:space-between;

    margin-top:15px;

    padding-top:15px;

    border-top:1px solid #ddd;

    font-size:24px;

    font-weight:bold;

    color:#8b0000;
}

/* ================= MINIMUM ORDER ================= */

.minimum-order{
    margin-top:18px;

    padding:14px;

    border-radius:8px;

    background:#fff3cd;

    color:#856404;

    text-align:center;

    font-weight:bold;
}

.minimum-order.success{
    background:#d1e7dd;

    color:#0f5132;
}

/* ================= BUTTONS ================= */

.buttons{
    display:flex;

    justify-content:space-between;

    gap:15px;

    margin-top:25px;
}

.btn{
    display:inline-block;

    text-decoration:none;

    border:none;

    padding:13px 20px;

    border-radius:7px;

    font-size:16px;

    cursor:pointer;

    text-align:center;
}

.continue-btn{
    background:#555;

    color:white;
}

.continue-btn:hover{
    background:#333;
}

.checkout-btn{
    background:#8b0000;

    color:white;
}

.checkout-btn:hover{
    background:#a50000;
}

.checkout-btn.disabled{
    background:#999;

    cursor:not-allowed;

    pointer-events:none;
}

/* ================= CLEAR CART ================= */

.clear-cart-btn{
    margin-top:15px;

    background:#dc3545;

    color:white;

    border:none;

    padding:10px 15px;

    border-radius:7px;

    cursor:pointer;
}

.clear-cart-btn:hover{
    background:#bb2d3b;
}

/* ================= FOOTER ================= */

.footer{
    background:#8b0000;

    color:white;

    text-align:center;

    padding:25px 10px;

    margin-top:30px;
}

/* ================= MOBILE ================= */

@media(max-width:750px){

    .cart-item{

        grid-template-columns:
        65px
        1fr
        auto;

        gap:12px;

    }

    .quantity{
        grid-column:2 / 3;
    }

    .item-total{
        grid-column:3 / 4;
        grid-row:1 / 3;
    }

    .remove-btn{
        grid-column:2 / 4;
        width:100%;
    }

}

@media(max-width:500px){

    .cart-box{
        padding:15px;
    }

    .cart-item{
        grid-template-columns:
        60px
        1fr;
    }

    .item-total{
        grid-column:2;
        grid-row:auto;
    }

    .quantity{
        grid-column:2;
    }

    .remove-btn{
        grid-column:1 / 3;
    }

    .buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

    .summary-total{
        font-size:21px;
    }

}

</style>

</head>


<body>

<div id="cart-items"></div>

<div

>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

/* =====================================================
   SETTINGS
===================================================== */

const MINIMUM_ORDER = 399;


/* =====================================================
   CART
===================================================== */

let cart = [];


/* =====================================================
   LOAD CART SAFELY
===================================================== */

function loadCart(){

    try{

        const savedCart =
        localStorage.getItem(
            "sweetyCart"
        );

        cart =
        savedCart
        ?
        JSON.parse(savedCart)
        :
        [];

        if(!Array.isArray(cart)){

            cart = [];

        }

    }

    catch(error){

        console.error(
            "Cart load error:",
            error
        );

        cart = [];

    }

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(price){

    return Number(price || 0)
    .toLocaleString(
        "en-IN"
    );

}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(){

    localStorage.setItem(

        "sweetyCart",

        JSON.stringify(cart)

    );

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(){

    const cartItems =
    document.getElementById(
        "cart-items"
    );

    const cartSummary =
    document.getElementById(
        "cart-summary"
    );

    const cartSubtotal =
    document.getElementById(
        "cart-subtotal"
    );

    const cartTotal =
    document.getElementById(
        "cart-total"
    );

    const discountRow =
    document.getElementById(
        "discount-row"
    );

    const discountAmount =
    document.getElementById(
        "discount-amount"
    );

    const minimumMessage =
    document.getElementById(
        "minimum-order-message"
    );

    const checkoutButton =
    document.getElementById(
        "checkout-button"
    );


    cartItems.innerHTML = "";


    /* =================================================
       EMPTY CART
    ================================================= */

    if(cart.length === 0){

        cartSummary.style.display =
        "none";


        cartItems.innerHTML = `

            <div class="empty-cart">

                <h2>
                    🛒 Cart खाली है
                </h2>

                <p>
                    Products page से अपना
                    पसंदीदा product add करें।
                </p>

                <a
                    href="products.html"
                    class="btn checkout-btn"
                >

                    Products देखें

                </a>

            </div>

        `;


        return;

    }


    /* =================================================
       CALCULATE SUBTOTAL
    ================================================= */

    let subtotal = 0;


    cart.forEach(
        function(item){

            const price =
            Number(item.price) || 0;


            const quantity =
            Math.max(
                1,
                Number(item.quantity) || 1
            );


            subtotal +=
            price * quantity;

        }
    );


    /* =================================================
       DISCOUNT
       
       IMPORTANT:
       Discount yaha automatically
       hard-code nahi kiya gaya.
       
       Agar Admin/Firebase se future me
       discount amount cart me save kiya
       jayega to uske liye structure
       ready hai.
    ================================================= */

    let discount = 0;


    /*
       Agar future me cart item ya
       localStorage me discountPercent
       available ho to use kiya ja sakta hai.
    */

    const savedDiscountPercent =
    Number(
        localStorage.getItem(
            "sweetyDiscountPercent"
        )
    ) || 0;


    const savedDiscountEnabled =
    localStorage.getItem(
        "sweetyDiscountEnabled"
    ) === "true";


    if(
        savedDiscountEnabled &&
        savedDiscountPercent > 0
    ){

        discount =
        Math.round(
            subtotal *
            savedDiscountPercent /
            100
        );

    }


    /* =================================================
       FINAL TOTAL
    ================================================= */

    const finalTotal =
    Math.max(
        0,
        subtotal - discount
    );


    /* =================================================
       SHOW SUMMARY
    ================================================= */

    cartSummary.style.display =
    "block";


    cartSubtotal.textContent =
    formatPrice(subtotal);


    cartTotal.textContent =
    formatPrice(finalTotal);


    /* =================================================
       DISCOUNT DISPLAY
    ================================================= */

    if(discount > 0){

        discountRow.style.display =
        "flex";

        discountAmount.textContent =
        formatPrice(discount);

    }

    else{

        discountRow.style.display =
        "none";

    }


    /* =================================================
       MINIMUM ORDER ₹399
    ================================================= */

    if(finalTotal < MINIMUM_ORDER){

        const remaining =
        MINIMUM_ORDER - finalTotal;


        minimumMessage.className =
        "minimum-order";


        minimumMessage.innerHTML = `

            ⚠️ Minimum order ₹${formatPrice(MINIMUM_ORDER)}
            है।

            <br>

            अभी ₹${formatPrice(remaining)}
            और के products add करें।

        `;


        checkoutButton.classList.add(
            "disabled"
        );


        checkoutButton.setAttribute(
            "aria-disabled",
            "true"
        );

    }

    else{

        minimumMessage.className =
        "minimum-order success";


        minimumMessage.innerHTML = `

            ✅ Minimum order complete.
            आप checkout कर सकते हैं।

        `;


        checkoutButton.classList.remove(
            "disabled"
        );


        checkoutButton.removeAttribute(
            "aria-disabled"
        );

    }


    /* =================================================
       CREATE CART ITEMS
    ================================================= */

    cart.forEach(
        function(item,index){

            const price =
            Number(item.price) || 0;


            const quantity =
            Math.max(
                1,
                Number(item.quantity) || 1
            );


            const itemTotal =
            price * quantity;


            let imageHTML;


            /* ================= IMAGE ================= */

            if(item.image){

                imageHTML = `

                    <img
                        src="${escapeHTML(item.image)}"
                        class="cart-image"
                        alt="${escapeHTML(item.name || "Product")}"
                        onerror="this.style.display='none'"
                    >

                `;

            }

            else{

                imageHTML = `

                    <div class="cart-icon">
                        🌶️
                    </div>

                `;

            }


            /* ================= CART ITEM ================= */

            const cartItem =
            document.createElement(
                "div"
            );


            cartItem.className =
            "cart-item";


            cartItem.innerHTML = `

                ${imageHTML}


                <div>

                    <h3>
                        ${escapeHTML(
                            item.name ||
                            "Product"
                        )}
                    </h3>

                    <p>
                        Size:
                        <strong>
                            ${escapeHTML(
                                item.size ||
                                ""
                            )}
                        </strong>
                    </p>

                    <p>
                        Price:
                        <strong>
                            ₹${formatPrice(price)}
                        </strong>
                    </p>

                </div>


                <div class="quantity">

                    <button
                        type="button"
                        onclick="decreaseQuantity(${index})"
                    >

                        −

                    </button>


                    <span>
                        ${quantity}
                    </span>


                    <button
                        type="button"
                        onclick="increaseQuantity(${index})"
                    >

                        +

                    </button>

                </div>


                <div class="item-total">

                    ₹${formatPrice(itemTotal)}

                </div>


                <button
                    type="button"
                    class="remove-btn"
                    onclick="removeItem(${index})"
                >

                    ❌ Remove

                </button>

            `;


            cartItems.appendChild(
                cartItem
            );

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   INCREASE QUANTITY
===================================================== */

function increaseQuantity(index){

    if(!cart[index]){
        return;
    }


    cart[index].quantity =
    (
        Number(
            cart[index].quantity
        ) || 1
    ) + 1;


    saveCart();

    displayCart();

}


/* =====================================================
   DECREASE QUANTITY
===================================================== */

function decreaseQuantity(index){

    if(!cart[index]){
        return;
    }


    cart[index].quantity =
    (
        Number(
            cart[index].quantity
        ) || 1
    ) - 1;


    if(
        cart[index].quantity <= 0
    ){

        cart.splice(
            index,
            1
        );

    }


    saveCart();

    displayCart();

}


/* =====================================================
   REMOVE ITEM
===================================================== */

function removeItem(index){

    if(!cart[index]){
        return;
    }


    const productName =
    cart[index].name ||
    "Product";


    const confirmRemove =
    confirm(
        "Kya aap " +
        productName +
        " ko cart se remove karna chahte hain?"
    );


    if(!confirmRemove){

        return;

    }


    cart.splice(
        index,
        1
    );


    saveCart();

    displayCart();

}


/* =====================================================
   CLEAR CART
===================================================== */

function clearCart(){

    if(cart.length === 0){

        return;

    }


    const confirmClear =
    confirm(
        "Kya aap pura cart empty karna chahte hain?"
    );


    if(!confirmClear){

        return;

    }


    cart = [];


    saveCart();

    displayCart();

}


/* =====================================================
   CLEAR CART BUTTON
===================================================== */

document
.getElementById(
    "clear-cart-button"
)
.addEventListener(
    "click",
    clearCart
);


/* =====================================================
   CHECKOUT PROTECTION
===================================================== */

document
.getElementById(
    "checkout-button"
)
.addEventListener(
    "click",
    function(event){

        /*
           Checkout click hone se pehle
           dobara total calculate karenge.
        */

        let subtotal = 0;


        cart.forEach(
            function(item){

                const price =
                Number(item.price) || 0;


                const quantity =
                Math.max(
                    1,
                    Number(item.quantity) || 1
                );


                subtotal +=
                price * quantity;

            }
        );


        const discountPercent =
        Number(
            localStorage.getItem(
                "sweetyDiscountPercent"
            )
        ) || 0;


        const discountEnabled =
        localStorage.getItem(
            "sweetyDiscountEnabled"
        ) === "true";


        let discount = 0;


        if(
            discountEnabled &&
            discountPercent > 0
        ){

            discount =
            Math.round(
                subtotal *
                discountPercent /
                100
            );

        }


        const total =
        Math.max(
            0,
            subtotal - discount
        );


        if(total < MINIMUM_ORDER){

            event.preventDefault();


            alert(

                "⚠️ Minimum order ₹" +
                MINIMUM_ORDER +
                " hai.\n\n" +

                "Abhi ₹" +
                (
                    MINIMUM_ORDER -
                    total
                ) +
                " aur ke products add karein."

            );


            return;

        }


        /*
           Cart valid hai.
           Checkout page open hone do.
        */

    }
);


/* =====================================================
   STORAGE CHANGE
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            "sweetyCart"
        ){

            loadCart();

            displayCart();

        }

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

loadCart();

displayCart();

</script>


</body>

</html>
