/* =====================================================
   DEFAULT SIZES
===================================================== */

function getDefaultSizes(
    productId
){

    const largeIds = [

        "haldi",

        "dhaniya",

        "lal-mirch",

        "sattu",

        "besan"

    ];


    if(
        largeIds.includes(
            productId
        )
    ){

        return [

            "1 KG",

            "5 KG",

            "10 KG",

            "15 KG",

            "20 KG",

            "25 KG",

            "30 KG"

        ];

    }


    return [

        "1 KG",

        "500 GM",

        "250 GM"

    ];

}



/* =====================================================
   NORMALIZE SIZES
===================================================== */

function normalizeSizes(
    value,
    productId
){

    if(
        Array.isArray(value) &&
        value.length
    ){

        return value

            .map(
                function(size){

                    return String(
                        size
                    ).trim();

                }
            )

            .filter(
                Boolean
            );

    }


    return getDefaultSizes(
        productId
    );

}



/* =====================================================
   RENDER SIZE LIST
===================================================== */

function renderSizeList(
    container,
    sizes
){

    container.innerHTML =
    "";


    if(
        !sizes.length
    ){

        container.innerHTML =
        '<span style="color:#777;font-size:13px;">No sizes added.</span>';

        return;

    }


    sizes.forEach(
        function(
            size,
            index
        ){

            const chip =
            document.createElement(
                "span"
            );


            chip.className =
            "size-chip";


            const text =
            document.createElement(
                "span"
            );


            text.textContent =
            size;


            const remove =
            document.createElement(
                "button"
            );


            remove.type =
            "button";


            remove.className =
            "size-remove-btn";


            remove.textContent =
            "×";


            remove.title =
            "Remove " +
            size;


            remove.addEventListener(
                "click",
                function(){

                    sizes.splice(
                        index,
                        1
                    );


                    renderSizeList(
                        container,
                        sizes
                    );

                }
            );


            chip.appendChild(
                text
            );


            chip.appendChild(
                remove
            );


            container.appendChild(
                chip
            );

        }
    );

}

        if(

            user &&

            user.email &&

            user.email.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase()

        ){

            document
            .getElementById(
                "loginSection"
            )
            .style.display =
            "none";


            document
            .getElementById(
                "dashboard"
            )
            .style.display =
            "block";


            loadProducts();

            loadOrders();

        }

        else{

            document
            .getElementById(
                "loginSection"
            )
            .style.display =
            "block";


            document
            .getElementById(
                "dashboard"
            )
            .style.display =
            "none";

        }

    }
);



/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const list =
    document.getElementById(
        "productList"
    );


    list.innerHTML =
    "<p style='text-align:center;'>⏳ Products loading...</p>";


    let inStock =
    0;


    let outStock =
    0;


    for(
        const product of products
    ){

        let stock =
        true;


        let productData =
        null;


        try{

            const snap =
            await getDoc(

                doc(
                    db,
                    "products",
                    product.id
                )

            );


            if(
                snap.exists()
            ){

                productData =
                snap.data();


                stock =
                productData.inStock !== false;

            }

        }

        catch(error){

            console.error(
                "Product read error:",
                error
            );

        }


        if(
            stock
        ){

            inStock++;

        }

        else{

            outStock++;

        }

    }



    /* ==============================================
       RESET LIST
    ============================================== */

    list.innerHTML =
    "";



    /* ==============================================
       RENDER PRODUCTS
    ============================================== */

    for(
        const product of products
    ){

        let stock =
        true;


        let data =
        null;


        try{

            const snap =
            await getDoc(

                doc(
                    db,
                    "products",
                    product.id
                )

            );


            if(
                snap.exists()
            ){

                data =
                snap.data();


                stock =
                data.inStock !== false;

            }

        }

        catch(error){

            console.error(
                error
            );

        }



        const row =
        document.createElement(
            "div"
        );


        row.className =
        "product-row";



        row.innerHTML = `

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-id">
                    Product ID: ${product.id}
                </div>


                <div class="price-editor">

                    <span class="current-price">

                        Current Price: ₹

                        <span class="price-value">
                            Loading...
                        </span>

                    </span>


                    <input
                        type="number"
                        class="price-input"
                        min="0"
                        step="1"
                        placeholder="New price"
                    >


                    <button
                        type="button"
                        class="price-save-btn"
                    >
                        💾 Save Price
                    </button>

                </div>



                <div class="size-editor">

                    <div class="size-title">
                        📦 Product Sizes
                    </div>


                    <div class="size-add-row">

                        <input
                            type="text"
                            class="size-input"
                            placeholder="Example: 750 GM"
                        >


                        <button
                            type="button"
                            class="size-add-btn"
                        >
                            ➕ Add Size
                        </button>

                    </div>


                    <div class="size-list">

                        <span style="color:#777;font-size:13px;">
                            Sizes loading...
                        </span>

                    </div>


                    <button
                        type="button"
                        class="size-save-btn"
                    >
                        💾 Save Sizes
                    </button>


                    <div class="size-help">
                        Size add/remove karke Save Sizes dabayein.
                    </div>

                </div>

            </div>


            <button
                type="button"
                class="stock-btn
                ${stock ? "in-stock" : "out-stock"}"
            >

                ${
                    stock
                    ? "✅ In Stock"
                    : "❌ Out of Stock"
                }

            </button>

        `;



        /* ==============================================
           ELEMENTS
        ============================================== */

        const priceValue =
        row.querySelector(
            ".price-value"
        );


        const priceInput =
        row.querySelector(
            ".price-input"
        );


        const priceSaveButton =
        row.querySelector(
            ".price-save-btn"
        );


        const sizeInput =
        row.querySelector(
            ".size-input"
        );


        const sizeAddButton =
        row.querySelector(
            ".size-add-btn"
        );


        const sizeSaveButton =
        row.querySelector(
            ".size-save-btn"
        );


        const sizeList =
        row.querySelector(
            ".size-list"
        );


        const stockButton =
        row.querySelector(
            ".stock-btn"
        );



        /* ==============================================
           CURRENT PRICE
        ============================================== */

        if(
            data &&
            data.price !== undefined &&
            data.price !== null
        ){

            const currentPrice =
            Number(
                data.price
            );


            if(
                Number.isFinite(
                    currentPrice
                )
            ){

                priceValue.textContent =
                Math.round(
                    currentPrice
                );

            }

            else{

                priceValue.textContent =
                "Not set";

            }

        }

        else{

            priceValue.textContent =
            "Not set";

        }



        /* ==============================================
           SIZES
        ============================================== */

        let productSizes =
        normalizeSizes(

            data
            ? data.sizes
            : null,

            product.id

        );


        renderSizeList(
            sizeList,
            productSizes
        );



        /* ==============================================
           ADD SIZE
        ============================================== */

        sizeAddButton.addEventListener(
            "click",
            function(){

                const value =
                sizeInput.value.trim();


                if(
                    !value
                ){

                    alert(
                        "Pehle size likhein. Example: 750 GM"
                    );

                    return;

                }


                const duplicate =
                productSizes.some(
                    function(size){

                        return (

                            size.toLowerCase() ===
                            value.toLowerCase()

                        );

                    }
                );


                if(
                    duplicate
                ){

                    alert(
                        "Ye size already added hai."
                    );

                    return;

                }


                productSizes.push(
                    value
                );


                sizeInput.value =
                "";


                renderSizeList(
                    sizeList,
                    productSizes
                );

            }
        );



        /* ==============================================
           ENTER = ADD SIZE
        ============================================== */

        sizeInput.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key ===
                    "Enter"
                ){

                    event.preventDefault();

                    sizeAddButton.click();

                }

            }
        );



        /* ==============================================
           SAVE SIZES
        ============================================== */

        sizeSaveButton.addEventListener(
            "click",
            async function(){

                if(
                    !productSizes.length
                ){

                    alert(
                        "Kam se kam ek size hona chahiye."
                    );

                    return;

                }


                sizeSaveButton.disabled =
                true;


                sizeSaveButton.textContent =
                "⏳ Saving...";


                try{

                    await setDoc(

                        doc(
                            db,
                            "products",
                            product.id
                        ),

                        {

                            name:
                            product.name,

                            sizes:
                            productSizes

                        },

                        {

                            merge:true

                        }

                    );


                    alert(

                        "✅ " +
                        product.name +
                        " ke sizes successfully save ho gaye."

                    );

                }

                catch(error){

                    console.error(
                        "Size update error:",
                        error
                    );


                    alert(
                        "❌ Size save nahi hua. Firebase Firestore Rules check karein."
                    );

                }


                sizeSaveButton.disabled =
                false;


                sizeSaveButton.textContent =
                "💾 Save Sizes";

            }
        );



        /* ==============================================
           SAVE PRICE
        ============================================== */

        priceSaveButton.addEventListener(
            "click",
            async function(){

                const newPrice =
                Number(
                    priceInput.value
                );


                if(
                    !Number.isFinite(
                        newPrice
                    ) ||
                    newPrice < 0
                ){

                    alert(
                        "Please valid price likhein."
                    );

                    return;

                }


                priceSaveButton.disabled =
                true;


                priceSaveButton.textContent =
                "⏳ Saving...";


                try{

                    await setDoc(

                        doc(
                            db,
                            "products",
                            product.id
                        ),

                        {

                            name:
                            product.name,

                            price:
                            newPrice

                        },

                        {

                            merge:true

                        }

                    );


                    priceValue.textContent =
                    Math.round(
                        newPrice
                    );


                    priceInput.value =
                    "";


                    alert(
                        "✅ Price successfully update ho gaya."
                    );

                }

                catch(error){

                    console.error(
                        "Price update error:",
                        error
                    );


                    alert(
                        "❌ Price update nahi hua. Firebase Firestore Rules check karein."
                    );

                }


                priceSaveButton.disabled =
                false;


                priceSaveButton.textContent =
                "💾 Save Price";

            }
        );



        /* ==============================================
           STOCK
        ============================================== */

        stockButton.addEventListener(
            "click",
            async function(){

                await toggleStock(

                    product,

                    !stock

                );

            }
        );



        list.appendChild(
            row
        );

    }



    /* ==============================================
       STATISTICS
    ============================================== */

    document
    .getElementById(
        "totalProducts"
    )
    .textContent =
    products.length;


    document
    .getElementById(
        "inStockProducts"
    )
    .textContent =
    inStock;


    document
    .getElementById(
        "outStockProducts"
    )
    .textContent =
    outStock;

}



/* =====================================================
   TOGGLE STOCK
===================================================== */

async function toggleStock(
    product,
    newStock
){

    try{

        await setDoc(

            doc(
                db,
                "products",
                product.id
            ),

            {

                name:
                product.name,

                inStock:
                newStock

            },

            {

                merge:true

            }

        );


        await loadProducts();


        alert(

            newStock

            ? "✅ " +
              product.name +
              " In Stock ho gaya."

            : "❌ " +
              product.name +
              " Out of Stock ho gaya."

        );

    }

    catch(error){

        console.error(
            "Stock update error:",
            error
        );


        alert(
            "❌ Stock update nahi hua. Firebase Firestore Rules check karein."
        );

    }

}



/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    const ordersList =
    document.getElementById(
        "ordersList"
    );


    ordersList.innerHTML =
    `

        <div class="no-orders">

            ⏳ Orders loading...

        </div>

    `;


    try{

        const snapshot =
        await getDocs(

            collection(
                db,
                "orders"
            )

        );


        if(
            snapshot.empty
        ){

            ordersList.innerHTML =
            `

                <div class="no-orders">

                    Abhi koi Firebase order nahi mila.

                </div>

            `;

            return;

        }


        ordersList.innerHTML =
        "";



        snapshot.forEach(
            function(order){

                const data =
                order.data();


                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "order-item";



                /* ======================================
                   DATE
                ====================================== */

                let orderDate =
                "Date unavailable";


                if(
                    data.createdAt &&
                    typeof data.createdAt.toDate ===
                    "function"
                ){

                    orderDate =
                    data.createdAt
                    .toDate()
                    .toLocaleString(
                        "en-IN"
                    );

                }



                /* ======================================
                   STATUS
                ====================================== */

                const currentStatus =
                ORDER_STATUSES.includes(
                    data.status
                )

                ? data.status

                : "New";



                /* ======================================
                   ITEMS
                ====================================== */

                let itemsHTML =
                "";


                if(
                    Array.isArray(
                        data.items
                    ) &&
                    data.items.length
                ){

                    data.items.forEach(
                        function(item){

                            const itemName =
                            item.name ||
                            "Product";


                            const itemSize =
                            item.size ||
                            "-";


                            const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                            const price =
                            Number(
                                item.price
                            ) || 0;


                            const itemTotal =
                            price *
                            quantity;


                            itemsHTML += `

                                <div class="order-product">

                                    <strong>
                                        ${escapeHTML(itemName)}
                                    </strong>

                                    <br>

                                    Size:
                                    ${escapeHTML(itemSize)}

                                    |

                                    Qty:
                                    ${quantity}

                                    |

                                    ₹${Math.round(itemTotal)}

                                </div>

                            `;

                        }
                    );

                }

                else{

                    itemsHTML =

                    `

                        <div class="order-product">

                            Order items available nahi hain.

                        </div>

                    `;

                }



                /* ======================================
                   ORDER HTML
                ====================================== */

                div.innerHTML = `

                    <div class="order-header">

                        <div class="order-id">

                            🧾 Order ID:
                            ${escapeHTML(order.id)}

                        </div>


                        <div class="order-date">

                            ${escapeHTML(orderDate)}

                        </div>

                    </div>



                    <div class="customer-box">

                        <strong>
                            👤 Customer Details
                        </strong>

                        <br>

                        Name:
                        ${escapeHTML(
                            data.customerName ||
                            data.name ||
                            "-"
                        )}

                        <br>

                        Mobile:
                        ${escapeHTML(
                            data.customerPhone ||
                            data.phone ||
                            "-"
                        )}

                        <br>

                        Address:
                        ${escapeHTML(
                            data.customerAddress ||
                            data.address ||
                            "-"
                        )}

                        <br>

                        City:
                        ${escapeHTML(
                            data.customerCity ||
                            data.city ||
                            "-"
                        )}

                        <br>

                        PIN:
                        ${escapeHTML(
                            data.customerPin ||
                            data.pin ||
                            "-"
                        )}

                        <br>

                        Payment:
                        ${escapeHTML(
                            data.paymentMethod ||
                            "Cash on Delivery"
                        )}

                    </div>



                    <div class="order-products">

                        <strong>
                            🛒 Order Items
                        </strong>

                        <br><br>

                        ${itemsHTML}

                    </div>



                    <div class="order-total">

                        Total:
                        ₹${Math.round(
                            Number(
                                data.total
                            ) || 0
                        )}

                    </div>



                    <div class="status-box">

                        <span class="status-label">

                            📌 Order Status:

                        </span>


                        <select
                            class="status-select"
                        >

                            ${ORDER_STATUSES.map(
                                function(status){

                                    return `

                                        <option
                                            value="${status}"
                                            ${
                                                status ===
                                                currentStatus
                                                ? "selected"
                                                : ""
                                            }
                                        >

                                            ${status}

                                        </option>

                                    `;

                                }
                            ).join("")}

                        </select>


                        <button
                            type="button"
                            class="status-save-btn"
                        >

                            💾 Save Status

                        </button>


                        <span
                            class="status-message"
                        ></span>

                    </div>

                `;



                /* ======================================
                   STATUS ELEMENTS
                ====================================== */

                const statusSelect =
                div.querySelector(
                    ".status-select"
                );


                const statusSaveButton =
                div.querySelector(
                    ".status-save-btn"
                );


                const statusMessage =
                div.querySelector(
                    ".status-message"
                );



                /* ======================================
                   SAVE STATUS
                ====================================== */

                statusSaveButton.addEventListener(
                    "click",
                    async function(){

                        const newStatus =
                        statusSelect.value;


                        statusSaveButton.disabled =
                        true;


                        statusSaveButton.textContent =
                        "⏳ Saving...";


                        statusMessage.textContent =
                        "";


                        try{

                            await setDoc(

                                doc(
                                    db,
                                    "orders",
                                    order.id
                                ),

                                {

                                    status:
                                    newStatus

                                },

                                {

                                    merge:true

                                }

                            );


                            statusMessage.textContent =
                            "✅ Status saved";


                            statusMessage.style.color =
                            "#16752b";


                            setTimeout(
                                function(){

                                    statusMessage.textContent =
                                    "";

                                },
                                2500
                            );

                        }

                        catch(error){

                            console.error(
                                "Order status error:",
                                error
                            );


                            statusMessage.textContent =
                            "❌ Save nahi hua";


                            statusMessage.style.color =
                            "#a00000";


                            alert(

                                "Order status update nahi hua. Firebase Firestore Rules check karein."

                            );

                        }


                        statusSaveButton.disabled =
                        false;


                        statusSaveButton.textContent =
                        "💾 Save Status";

                    }
                );



                ordersList.appendChild(
                    div
                );

            }
        );

    }

    catch(error){

        console.error(
            "Orders error:",
            error
        );


        ordersList.innerHTML =
        `

            <div class="no-orders">

                ❌ Orders load nahi ho pa rahe.

                <br><br>

                Firebase Firestore Rules check karein.

            </div>

        `;

    }

}



/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(
    value
){

    const div =
    document.createElement(
        "div"
    );


    div.textContent =
    String(
        value ?? ""
    );


    return div.innerHTML;

}

/* =====================================================
   ERROR MESSAGE
===================================================== */

function getErrorMessage(
    code
){

    if(
        code ===
        "auth/invalid-credential"
    ){

        return
        "Password galat hai ya admin account nahi mila.";

    }


    if(
        code ===
        "auth/user-not-found"
    ){

        return
        "Admin account nahi mila.";

    }


    if(
        code ===
        "auth/wrong-password"
    ){

        return
        "Password galat hai.";

    }


    if(
        code ===
        "auth/invalid-email"
    ){

        return
        "Admin email galat hai.";

    }


    if(
        code ===
        "auth/too-many-requests"
    ){

        return
        "Bahut baar try hua. Thodi der baad try karein.";

    }


    if(
        code ===
        "auth/network-request-failed"
    ){

        return
        "Internet connection check karein.";

    }


    return
    "Login nahi hua. Dobara try karein.";

}
