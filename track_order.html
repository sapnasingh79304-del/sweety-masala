<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Order | Sweety Masala</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff8ed;
    color:#333;
}

/* HEADER */

header{
    background:#8b0000;
    color:white;
    text-align:center;
    padding:20px 15px;
}

header h1{
    margin-bottom:6px;
}

header p{
    font-size:15px;
}


/* CONTAINER */

.container{
    max-width:1000px;
    margin:25px auto;
    padding:10px 15px 40px;
}


/* BOX */

.box{
    background:white;
    padding:22px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.box h2{
    color:#8b0000;
    margin-bottom:16px;
}


/* MESSAGES */

.message{
    display:none;
    padding:14px;
    border-radius:8px;
    margin-bottom:18px;
    text-align:center;
    font-weight:bold;
}

.error{
    background:#ffe5e5;
    color:#a00000;
}

.success{
    background:#e6f8ea;
    color:#16852d;
}

.loading{
    background:#fff4d6;
    color:#8b0000;
}


/* LOGIN */

.login-required{
    text-align:center;
    padding:35px 15px;
}

.login-required h2{
    color:#8b0000;
    margin-bottom:10px;
}

.login-btn{
    display:inline-block;
    margin-top:15px;
    padding:13px 25px;
    background:#8b0000;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}


/* USER INFO */

.user-info{
    background:#fff4d6;
    border:1px solid #e2c766;
    padding:14px;
    border-radius:9px;
    margin-bottom:15px;
}

.user-info strong{
    color:#8b0000;
}


/* REFRESH */

.refresh-btn{
    width:100%;
    padding:13px;
    background:#8b0000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.refresh-btn:hover{
    background:#a50000;
}


/* ORDER CARD */

.order-card{
    background:white;
    border:2px solid #ead8bd;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.order-card.cancelled{
    border-color:#e00000;
}

.order-card.returned{
    border-color:#16852d;
}


/* ORDER HEADER */

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.order-id{
    font-size:14px;
    color:#555;
    word-break:break-all;
}

.order-id strong{
    color:#8b0000;
}


/* STATUS */

.status-badge{
    display:inline-block;
    padding:7px 13px;
    border-radius:20px;
    font-weight:bold;
}

.status-new{
    background:#fff4d6;
    color:#8b0000;
}

.status-accepted{
    background:#e7f0ff;
    color:#1754a6;
}

.status-preparing{
    background:#fff0d0;
    color:#a85b00;
}

.status-shipped{
    background:#eee8ff;
    color:#6841a5;
}

.status-delivered{
    background:#e6f8ea;
    color:#16852d;
}

.status-cancelled{
    background:#ffe5e5;
    color:#a00000;
}

.status-return{
    background:#fff0d0;
    color:#9b5900;
}


/* CUSTOMER DETAILS */

.customer-details{
    background:#fafafa;
    border:1px solid #eee;
    border-radius:10px;
    padding:15px;
    margin-bottom:20px;
}

.detail-row{
    margin-bottom:8px;
    line-height:1.5;
}

.detail-row:last-child{
    margin-bottom:0;
}

.detail-label{
    font-weight:bold;
    color:#555;
}


/* PROGRESS */

.progress-box{
    background:#fff8ed;
    border:1px solid #ead8bd;
    padding:18px 10px;
    border-radius:12px;
    margin-bottom:20px;
}

.progress-title{
    font-weight:bold;
    color:#555;
    margin-bottom:18px;
    text-align:center;
}

.status-tracker{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.status-step{
    flex:1;
    text-align:center;
    position:relative;
}

.status-circle{
    width:38px;
    height:38px;
    border-radius:50%;
    margin:0 auto 8px;
    background:#ddd;
    color:#666;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    position:relative;
    z-index:2;
}

.status-name{
    font-size:11px;
    font-weight:bold;
    color:#777;
}

.status-line{
    position:absolute;
    top:18px;
    left:50%;
    width:100%;
    height:4px;
    background:#ddd;
    z-index:1;
}

.status-step:last-child .status-line{
    display:none;
}

.status-step.completed .status-circle{
    background:#16852d;
    color:white;
}

.status-step.completed .status-name{
    color:#16852d;
}

.status-step.completed .status-line{
    background:#16852d;
}

.status-step.current .status-circle{
    background:#8b0000;
    color:white;
    box-shadow:0 0 0 5px #f3d6d6;
}

.status-step.current .status-name{
    color:#8b0000;
}


/* ITEMS */

.items-title{
    color:#8b0000;
    font-size:20px;
    margin-bottom:12px;
}

.order-item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:13px 0;
    border-bottom:1px solid #ddd;
}

.order-item:last-child{
    border-bottom:none;
}

.item-name{
    font-weight:bold;
}

.item-info{
    color:#666;
    font-size:14px;
    margin-top:4px;
}

.item-price{
    color:#8b0000;
    font-weight:bold;
    white-space:nowrap;
}


/* TOTAL */

.total{
    text-align:right;
    margin-top:15px;
    font-size:21px;
    font-weight:bold;
    color:#8b0000;
}


/* ACTION BUTTONS */

.action-area{
    margin-top:20px;
}

.action-btn{
    width:100%;
    border:none;
    border-radius:8px;
    padding:14px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.cancel-btn{
    background:#c40000;
}

.cancel-btn:hover{
    background:#a00000;
}

.return-btn{
    background:#16852d;
}

.return-btn:hover{
    background:#116b24;
}


/* MESSAGES INSIDE ORDER */

.cancelled-message{
    background:#ffe5e5;
    color:#a00000;
    padding:13px;
    border-radius:8px;
    margin-top:15px;
    font-weight:bold;
    text-align:center;
}

.return-message{
    background:#fff4d6;
    color:#8b5900;
    padding:13px;
    border-radius:8px;
    margin-top:15px;
    font-weight:bold;
    text-align:center;
}


/* EMPTY */

.no-orders{
    text-align:center;
    padding:35px 15px;
    color:#666;
}

.shop-btn{
    display:inline-block;
    margin-top:15px;
    padding:13px 25px;
    background:#8b0000;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}


/* BACK */

.back-btn{
    display:block;
    width:100%;
    padding:13px;
    margin-top:12px;
    background:#555;
    color:white;
    text-decoration:none;
    text-align:center;
    border-radius:8px;
    font-weight:bold;
}

.back-btn:hover{
    background:#333;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        padding:10px;
    }

    .box{
        padding:17px;
    }

    .status-name{
        font-size:9px;
    }

    .status-circle{
        width:32px;
        height:32px;
        font-size:12px;
    }

    .status-line{
        top:15px;
    }

    .order-item{
        flex-direction:column;
    }

    .item-price{
        text-align:left;
    }

}

</style>

</head>

}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyCl15UMUZUhnfAAHWjtyR52APgLTuVd7a0",

    authDomain:
    "sweety-masala.firebaseapp.com",

    projectId:

    storageBucket:
    "sweety-masala.firebasestorage.app",

    messagingSenderId:
    "152835150862",

    appId:
    "1:152835150862:web:bdd6bafcc074aeb37e585f",

    measurementId:
    "G-NQ82YZCKG3"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



/* =========================================================
   ELEMENTS
========================================================= */

const loadingMessage =
document.getElementById(
    "loadingMessage"
);

const errorMessage =
document.getElementById(
    "errorMessage"
);

const successMessage =
document.getElementById(
    "successMessage"
);

const loginRequired =
document.getElementById(
    "loginRequired"
);

const customerArea =
document.getElementById(
    "customerArea"
);

const customerEmail =
document.getElementById(
    "customerEmail"
);

const ordersContainer =
document.getElementById(
    "ordersContainer"
);

const refreshBtn =
document.getElementById(
    "refreshBtn"
);



let currentUser = null;



/* =========================================================
   MESSAGES
========================================================= */

function hideMessages(){

    loadingMessage.style.display =
        "none";

    errorMessage.style.display =
        "none";

    successMessage.style.display =
        "none";

}


function showLoading(text){

    hideMessages();

    loadingMessage.textContent =
        text;

    loadingMessage.style.display =
        "block";

}


function showError(text){

    hideMessages();

    errorMessage.textContent =
        "❌ " + text;

    errorMessage.style.display =
        "block";

}


function showSuccess(text){

    hideMessages();

    successMessage.textContent =
        "✅ " + text;

    successMessage.style.display =
        "block";

}



/* =========================================================
   STATUS
========================================================= */

function cleanStatus(status){

    return String(
        status || "New"
    )
    .trim()
    .toLowerCase();

}


function getStatusClass(status){

    const s =
        cleanStatus(status);


    if(s === "new")
        return "status-new";


    if(s === "accepted")
        return "status-accepted";


    if(s === "preparing")
        return "status-preparing";


    if(s === "shipped")
        return "status-shipped";


    if(s === "delivered")
        return "status-delivered";


    if(
        s === "cancelled" ||
        s === "canceled"
    )
        return "status-cancelled";


    if(
        s.includes("return")
    )
        return "status-return";


    return "status-new";

}



/* =========================================================
   CUSTOMER CANCEL RULE
========================================================= */

function canCustomerCancel(status){

    const s =
        cleanStatus(status);


    return (

        s === "new" ||

        s === "accepted" ||

        s === "preparing"

    );

}



/* =========================================================
   CUSTOMER RETURN RULE
========================================================= */

function canCustomerReturn(status){

    const s =
        cleanStatus(status);


    return s === "delivered";

}



/* =========================================================
   PROGRESS
========================================================= */

function createProgress(status){

    const s =
        cleanStatus(status);


    const steps = [

        "new",

        "accepted",

        "preparing",

        "shipped",

        "delivered"

    ];


    let currentIndex =
        steps.indexOf(s);


    if(
        s === "cancelled" ||
        s === "canceled"
    ){

        currentIndex = -1;

    }


    if(
        s.includes("return")
    ){

        currentIndex = 4;

    }


    const names = [

        "New",

        "Accepted",

        "Preparing",

        "Shipped",

        "Delivered"

    ];


    let html =

    `
    <div class="progress-box">

        <div class="progress-title">
            📌 Order Progress
        </div>

        <div class="status-tracker">
    `;


    names.forEach(
        function(name,index){

            let className =
                "status-step";


            if(currentIndex >= 0){

                if(
                    index < currentIndex
                ){

                    className +=
                        " completed";

                }


                else if(
                    index === currentIndex
                ){

                    className +=
                        " current";

                }

            }


            html +=

            `
            <div class="${className}">

                <div class="status-circle">
                    ${index + 1}
                </div>

                <div class="status-name">
                    ${name}
                </div>

                <div class="status-line"></div>

            </div>
            `;

        }
    );


    html +=

    `
        </div>
    </div>
    `;


    return html;

}



/* =========================================================
   DATE
========================================================= */

function formatDate(timestamp){

    if(!timestamp)
        return "-";


    try{

        const date =
            timestamp.toDate();


        return date.toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch(error){

        return "-";

    }

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* =========================================================
   ORDER ITEMS
========================================================= */

function createItems(items){

    if(
        !Array.isArray(items) ||
        items.length === 0
    ){

        return `
        <div class="no-orders">
            Order items nahi mile.
        </div>
        `;

    }


    let html = "";


    items.forEach(
        function(item){

            const name =
                escapeHtml(
                    item.name ||
                    "Product"
                );


            const size =
                escapeHtml(
                    item.size ||
                    "-"
                );


            const quantity =
                Number(
                    item.quantity
                ) || 1;


            const price =
                Number(
                    item.price
                ) || 0;


            const itemTotal =
                price * quantity;


            html +=

            `
            <div class="order-item">

                <div>

                    <div class="item-name">
                        ${name}
                    </div>

                    <div class="item-info">
                        Size: ${size}
                    </div>

                    <div class="item-info">
                        Quantity: ${quantity}
                    </div>

                </div>

                <div class="item-price">
                    ₹${Math.round(itemTotal)}
                </div>

            </div>
            `;

        }
    );


    return html;

}



/* =========================================================
   CREATE ORDER CARD
========================================================= */

function createOrderCard(order){

    const data =
        order.data();


    const orderId =
        order.id;


    const status =
        data.status ||
        "New";


    const normalizedStatus =
        cleanStatus(status);


    const name =
        escapeHtml(
            data.customerName ||
            data.name ||
            "-"
        );


    const phone =
        escapeHtml(
            data.customerPhone ||
            data.phone ||
            "-"
        );


    const address =
        escapeHtml(
            data.customerAddress ||
            data.address ||
            "-"
        );


    const city =
        escapeHtml(
            data.customerCity ||
            data.city ||
            "-"
        );


    const pin =
        escapeHtml(
            data.customerPin ||
            data.pin ||
            "-"
        );


    const payment =
        escapeHtml(
            data.paymentMethod ||
            "Cash on Delivery"
        );


    const total =
        Number(
            data.total
        ) || 0;


    let actionHtml = "";



    /* =====================================================
       CANCEL BUTTON
    ===================================================== */

    if(
        canCustomerCancel(status)
    ){

        actionHtml +=

        `
        <button
            type="button"
            class="action-btn cancel-btn"
            data-action="cancel"
            data-order-id="${escapeHtml(orderId)}"
        >
            ❌ Cancel Order
        </button>
        `;

    }



    /* =====================================================
       RETURN BUTTON
    ===================================================== */

    if(
        canCustomerReturn(status)
    ){

        actionHtml +=

        `
        <button
            type="button"
            class="action-btn return-btn"
            data-action="return"
            data-order-id="${escapeHtml(orderId)}"
        >
            🔄 Return Product
        </button>
        `;

    }



    /* =====================================================
       CANCELLED MESSAGE
    ===================================================== */

    if(
        normalizedStatus === "cancelled" ||
        normalizedStatus === "canceled"
    ){

        actionHtml +=

        `
        <div class="cancelled-message">
            ❌ Ye order cancel ho chuka hai.
        </div>
        `;

    }



    /* =====================================================
       RETURN STATUS
    ===================================================== */

    if(
        normalizedStatus ===
        "return requested"
    ){

        actionHtml +=

        `
        <div class="return-message">
            🔄 Return request submit ho chuki hai.
            Admin request check karega.
        </div>
        `;

    }


    if(
        normalizedStatus ===
        "return approved"
    ){

        actionHtml +=

        `
        <div class="return-message">
            ✅ Return request approve ho gayi hai.
        </div>
        `;

    }


    if(
        normalizedStatus ===
        "return picked"
    ){

        actionHtml +=

        `
        <div class="return-message">
            📦 Return pickup process me hai.
        </div>
        `;

    }


    if(
        normalizedStatus ===
        "returned"
    ){

        actionHtml +=

        `
        <div class="return-message">
            ✅ Return complete ho gaya hai.
        </div>
        `;

    }



    const card =
        document.createElement(
            "div"
        );


    card.className =
        "order-card";


    if(
        normalizedStatus ===
        "cancelled" ||
        normalizedStatus ===
        "canceled"
    ){

        card.classList.add(
            "cancelled"
        );

    }


    if(
        normalizedStatus.includes(
            "return"
        ) ||
        normalizedStatus ===
        "returned"
    ){

        card.classList.add(
            "returned"
        );

    }



    card.innerHTML =

    `
    <div class="order-header">

        <div class="order-id">

            🧾 Order ID:

            <strong>
                ${escapeHtml(orderId)}
            </strong>

            <br>

            🕒 ${formatDate(
                data.createdAt
            )}

        </div>


        <div
            class="status-badge
            ${getStatusClass(status)}"
        >

            ${escapeHtml(status)}

        </div>

    </div>



    <div class="customer-details">

        <div class="detail-row">

            <span class="detail-label">
                Name:
            </span>

            ${name}

        </div>


        <div class="detail-row">

            <span class="detail-label">
                Mobile:
            </span>

            ${phone}

        </div>


        <div class="detail-row">

            <span class="detail-label">
                Address:
            </span>

            ${address}

        </div>


        <div class="detail-row">

            <span class="detail-label">
                City:
            </span>

            ${city}

        </div>


        <div class="detail-row">

            <span class="detail-label">
                PIN:
            </span>

            ${pin}

        </div>


        <div class="detail-row">

            <span class="detail-label">
                Payment:
            </span>

            ${payment}

        </div>

    </div>



    ${createProgress(status)}



    <h3 class="items-title">
        🛒 Order Items
    </h3>


    <div>

        ${createItems(
            data.items
        )}

    </div>


    <div class="total">

        Total:
        ₹${Math.round(total)}

    </div>



    ${
        actionHtml
        ?
        `
        <div class="action-area">

            ${actionHtml}

        </div>
        `
        :
        ""
    }

    `;


    return card;

}



/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

    if(!currentUser){

        return;

    }


    showLoading(
        "⏳ Aapke saare orders load ho rahe hain..."
    );


    ordersContainer.innerHTML = "";


    try{

        /*
        IMPORTANT:

        Ye customer ke account ke UID
        wale orders search karega.
        */

        const ordersQuery =
            query(
                collection(
                    db,
                    "orders"
                ),

                where(
                    "uid",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(
                ordersQuery
            );


        const orders = [];


        snapshot.forEach(
            function(order){

                orders.push(order);

            }
        );


        /* NEWEST ORDER FIRST */

        orders.sort(
            function(a,b){

                const aTime =
                    a.data().createdAt;

                const bTime =
                    b.data().createdAt;


                if(
                    !aTime ||
                    !bTime
                ){

                    return 0;

                }


                return (
                    bTime.toMillis()
                    -
                    aTime.toMillis()
                );

            }
        );


        hideMessages();


        if(
            orders.length === 0
        ){

            ordersContainer.innerHTML =

            `
            <div class="box no-orders">

                <h2>
                    📦 Abhi koi order nahi mila
                </h2>

                <p>
                    Is account se abhi koi order
                    place nahi hua hai.
                </p>


                <a
                    href="products.html"
                    class="shop-btn"
                >
                    🛒 Order Now
                </a>

            </div>
            `;

            return;

        }



        orders.forEach(
            function(order){

                ordersContainer.appendChild(
                    createOrderCard(order)
                );

            }
        );


        attachActionButtons();

    }
    catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        showError(
            "Orders load nahi ho pa rahe. Firebase Rules check karein."
        );

    }

}



/* =========================================================
   CANCEL ORDER
========================================================= */

async function cancelOrder(orderId){

    if(!currentUser){

        showError(
            "Pehle login karein."
        );

        return;

    }


    const confirmCancel =
        confirm(
            "Kya aap is order ko cancel karna chahte hain?"
        );


    if(!confirmCancel){

        return;

    }


    showLoading(
        "⏳ Order cancel ho raha hai..."
    );


    try{

        const orderRef =
            doc(
                db,
                "orders",
                orderId
            );


        await updateDoc(
            orderRef,
            {

                status:
                    "Cancelled",

                cancelledBy:
                    "customer",

                cancelledAt:
                    new Date()

            }
        );


        showSuccess(
            "Order successfully cancel ho gaya."
        );


        await loadOrders();

    }
    catch(error){

        console.error(
            "CANCEL ERROR:",
            error
        );


        showError(
            "Order cancel nahi hua. Firebase Rules check karein."
        );

    }

}



/* =========================================================
   RETURN ORDER
========================================================= */

async function returnOrder(orderId){

    if(!currentUser){

        showError(
            "Pehle login karein."
        );

        return;

    }


    const confirmReturn =
        confirm(
            "Kya aap is delivered product ko return karna chahte hain?"
        );


    if(!confirmReturn){

        return;

    }


    const reason =
        prompt(
            "Return ka reason likhein:"
        );


    if(
        reason === null ||
        !reason.trim()
    ){

        return;

    }


    showLoading(
        "⏳ Return request submit ho rahi hai..."
    );


    try{

        const orderRef =
            doc(
                db,
                "orders",
                orderId
            );


        await updateDoc(
            orderRef,
            {

                status:
                    "Return Requested",

                returnRequestedBy:
                    "customer",

                returnReason:
                    reason.trim(),

                returnRequestedAt:
                    new Date()

            }
        );


        showSuccess(
            "Return request successfully submit ho gayi."
        );


        await loadOrders();

    }
    catch(error){

        console.error(
            "RETURN ERROR:",
            error
        );


        showError(
            "Return request submit nahi hui. Firebase Rules check karein."
        );

    }

}



/* =========================================================
   BUTTON EVENTS
========================================================= */

function attachActionButtons(){

    const buttons =
        document.querySelectorAll(
            "[data-action]"
        );


    buttons.forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const action =
                        button.dataset.action;


                    const orderId =
                        button.dataset.orderId;


                    if(
                        action === "cancel"
                    ){

                        cancelOrder(
                            orderId
                        );

                    }


                    if(
                        action === "return"
                    ){

                        returnOrder(
                            orderId
                        );

                    }

                }
            );

        }
    );

}



/* =========================================================
   LOGIN STATE
========================================================= */

onAuthStateChanged(
    auth,
    async function(user){

        currentUser =
            user;


        if(!user){

            hideMessages();


            customerArea.style.display =
                "none";


            loginRequired.style.display =
                "block";


            return;

        }


        loginRequired.style.display =
            "none";


        customerArea.style.display =
            "block";


        customerEmail.textContent =
            user.email ||
            "Customer";


        await loadOrders();

    }
);



/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
    "click",
    function(){

        if(currentUser){

            loadOrders();

        }

    }
);


</script>
