/* =====================================================
   FIREBASE DOCUMENT IDs
   Admin Panel saves products using IDs such as:
   haldi, dhaniya, lal-mirch, etc.
===================================================== */

function productIds(name){

    const ids = [];

    const raw = String(name).trim();

    const slug = raw
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-|-$/g,"");

    ids.push(slug);

    if(raw !== slug){
        ids.push(raw);
    }

    /* Known Admin IDs */
    const aliases = {
        "Chana Sattu":"sattu",
        "Chana Besan":"besan"
    };

    if(aliases[raw]){
        ids.unshift(aliases[raw]);
    }

    return [...new Set(ids)];
}


/* =====================================================
   SIZE CONVERSION
===================================================== */

function sizeToKg(size){

    const value =
        String(size || "")
        .toUpperCase()
        .trim();

    const gm = value.match(/^([\d.]+)\s*GM$/);

    if(gm){
        return Number(gm[1]) / 1000;
    }

    const kg = value.match(/^([\d.]+)\s*KG$/);

    if(kg){
        return Number(kg[1]);
    }

    return 1;
}


/* =====================================================
   DISCOUNT
   Read from Firestore settings/discount.
===================================================== */

let discountEnabled = false;
let discountPercent = 0;


async function loadDiscount(){

    try{

        const snap =
            await getDoc(
                doc(db,"settings","discount")
            );

        if(snap.exists()){

            const data = snap.data();

            discountEnabled =
                data.enabled === true;

            discountPercent =
                Number(data.percent) || 0;

        }

    }
    catch(error){

        console.error(
            "Discount read error:",
            error
        );

    }
}


function getFinalPrice(price){

    const value =
        Number(price) || 0;

    if(!discountEnabled){
        return value;
    }

    return value -
        (value * discountPercent / 100);
}


function formatPrice(price){

    return Math.round(
        Number(price) || 0
    );

}


/* =====================================================
   GET PRODUCT FROM FIRESTORE
===================================================== */

async function getProductData(
    name,
    fallbackPrice,
    fallbackSizes
){

    try{

        const ids =
            productIds(name);

        for(const id of ids){

            const snap =
                await getDoc(
                    doc(db,"products",id)
                );

            if(snap.exists()){

                const data =
                    snap.data();

                return {

                    price:
                        data.price !== undefined &&
                        data.price !== null
                            ? Number(data.price)
                            : fallbackPrice,

                    sizes:
                        Array.isArray(data.sizes) &&
                        data.sizes.length > 0
                            ? data.sizes
                            : fallbackSizes,

                    inStock:
                        data.inStock !== false

                };

            }

        }

    }
    catch(error){

        console.error(
            "Product Firebase read error:",
            name,
            error
        );

    }


    return {

        price:fallbackPrice,

        sizes:fallbackSizes,

        inStock:true

    };

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
    name,
    size,
    price
){

    let cart = [];

    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    "sweetyCart"
                )
            ) || [];

    }
    catch(error){

        cart = [];

    }


    if(!Array.isArray(cart)){
        cart = [];
    }


    const existing =
        cart.find(function(item){

            return(
                item.name === name &&
                item.size === size
            );

        });


    if(existing){

        existing.quantity =
            (Number(existing.quantity) || 1) + 1;

        /* Always keep the latest Admin price */
        existing.price = price;

    }
    else{

        cart.push({

            name:name,

            size:size,

            price:price,

            quantity:1

        });

    }


    localStorage.setItem(
        "sweetyCart",
        JSON.stringify(cart)
    );


    alert(
        name +
        " (" +
        size +
        ") cart me add ho gaya! 🛒"
    );

}


/* =====================================================
   CREATE PRODUCT CARD
===================================================== */

function createProductCard(
    name,
    description,
    basePrice,
    sizes,
    icon,
    inStock
){

    const card =
        document.createElement("div");

    card.className =
        "product-card";


    const safeSizes =
        Array.isArray(sizes) &&
        sizes.length
            ? sizes
            : ["1 KG"];


    card.innerHTML = `

        <div class="product-icon">
            ${icon}
        </div>

        <h3>
            ${name}
        </h3>

        <p>
            ${description}
        </p>

        <div class="price">

            <span class="price-old"></span>

            <span class="price-current">
                ₹0
            </span>

            <br>

            <span
                class="discount-badge"
                style="display:none;"
            >
                0% OFF
            </span>

        </div>


        <label>
            Size
        </label>


        <select
            class="size-select"
            ${!inStock ? "disabled" : ""}
        >

            ${
                safeSizes
                .map(function(size){

                    return `
                        <option value="${String(size)}">
                            ${String(size)}
                        </option>
                    `;

                })
                .join("")
            }

        </select>


        ${
            inStock

            ?

            `
                <button
                    class="add-btn"
                    type="button"
                >
                    🛒 Add to Cart
                </button>
            `

            :

            `
                <button
                    class="out-of-stock-btn"
                    disabled
                    type="button"
                >
                    ❌ Out of Stock
                </button>
            `

        }

    `;


    const select =
        card.querySelector(
            ".size-select"
        );


    const currentPrice =
        card.querySelector(
            ".price-current"
        );


    const oldPrice =
        card.querySelector(
            ".price-old"
        );


    const discountBadge =
        card.querySelector(
            ".discount-badge"
        );


    function updatePrice(){

        const selectedSize =
            select.value;

        const kg =
            sizeToKg(
                selectedSize
            );


        const normalPrice =
            Number(basePrice) * kg;


        const finalPrice =
            getFinalPrice(
                normalPrice
            );


        currentPrice.textContent =
            "₹" +
            formatPrice(
                finalPrice
            );


        if(discountEnabled){

            oldPrice.textContent =
                "₹" +
                formatPrice(
                    normalPrice
                );

            oldPrice.style.display =
                "inline";

            discountBadge.textContent =
                discountPercent +
                "% OFF";

            discountBadge.style.display =
                "inline-block";

        }
        else{

            oldPrice.textContent = "";

            oldPrice.style.display =
                "none";

            discountBadge.style.display =
                "none";

        }

    }


    updatePrice();


    select.addEventListener(
        "change",
        updatePrice
    );


    if(inStock){

        const button =
            card.querySelector(
                ".add-btn"
            );


        button.addEventListener(
            "click",
            function(){

                const size =
                    select.value;

                const kg =
                    sizeToKg(
                        size
                    );

                const normalPrice =
                    Number(basePrice) * kg;

                const finalPrice =
                    getFinalPrice(
                        normalPrice
                    );


                addToCart(
                    name,
                    size,
                    formatPrice(
                        finalPrice
                    )
                );

            }
        );

    }


    return card;

}


/* =====================================================
   BUILD ALL PRODUCTS
   IMPORTANT: containers are cleared FIRST so a
   Firebase update can NEVER create duplicates.
===================================================== */

async function renderAllProducts(){

    const largeContainer =
        document.getElementById(
            "largeProducts"
        );

    const powderContainer =
        document.getElementById(
            "powderProducts"
        );

    const attaContainer =
        document.getElementById(
            "attaProducts"
        );

    const wholeContainer =
        document.getElementById(
            "wholeProducts"
        );


    largeContainer.innerHTML = "";
    powderContainer.innerHTML = "";
    attaContainer.innerHTML = "";
    wholeContainer.innerHTML = "";


    await loadDiscount();


    /* MAIN PRODUCTS */

    for(const product of largeProducts){

        const data =
            await getProductData(
                product.name,
                product.price,
                product.sizes
            );


        largeContainer.appendChild(

            createProductCard(

                product.name,

                product.description,

                data.price,

                data.sizes,

                "🌶️",

                data.inStock

            )

        );

    }


    /* POWDER PRODUCTS */

    for(const product of powderProducts){

        const data =
            await getProductData(
                product[0],
                product[2],
                ["250 GM","500 GM","1 KG"]
            );


        powderContainer.appendChild(

            createProductCard(

                product[0],

                product[1],

                data.price,

                data.sizes,

                "🥘",

                data.inStock

            )

        );

    }


    /* AATA PRODUCTS */

    for(const product of attaProducts){

        const data =
            await getProductData(
                product[0],
                product[2],
                ["1 KG","2 KG","3 KG","4 KG","5 KG"]
            );


        attaContainer.appendChild(

            createProductCard(

                product[0],

                product[1],

                data.price,

                data.sizes,

                "🌾",

                data.inStock

            )

        );

    }


    /* WHOLE SPICES */

    for(const product of wholeSpices){

        const data =
            await getProductData(
                product[0],
                product[2],
                ["50 GM","100 GM","250 GM"]
            );


        wholeContainer.appendChild(

            createProductCard(

                product[0],

                product[1],

                data.price,

                data.sizes,

                "🌿",

                data.inStock

            )

        );

    }

}


/* =====================================================
   REALTIME SYNC
   Every Admin price/size/stock change updates the
   customer page automatically.
===================================================== */

const allProducts = [

    ...largeProducts.map(
        p => p.name
    ),

    ...powderProducts.map(
        p => p[0]
    ),

    ...attaProducts.map(
        p => p[0]
    ),

    ...wholeSpices.map(
        p => p[0]
    )

];


let renderTimer = null;
let renderRunning = false;
let renderAgain = false;


function scheduleRender(){

    clearTimeout(
        renderTimer
    );


    renderTimer =
        setTimeout(
            async function(){

                if(renderRunning){

                    renderAgain = true;

                    return;

                }


                renderRunning = true;


                try{

                    await renderAllProducts();

                }
                finally{

                    renderRunning = false;


                    if(renderAgain){

                        renderAgain = false;

                        scheduleRender();

                    }

                }

            },
            250
        );

}


/* Listen to exact Admin document IDs */
for(const name of allProducts){

    const ids =
        productIds(name);


    for(const id of ids){

        onSnapshot(

            doc(
                db,
                "products",
                id
            ),

            function(){

                scheduleRender();

            }

        );

    }

}


/* Discount realtime sync */

onSnapshot(

    doc(
        db,
        "settings",
        "discount"
    ),

    function(){

        scheduleRender();

    }

);


/* FIRST LOAD */

renderAllProducts();

</script>

    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyCl15UMUZUhnfAAHWjtyR52APgLTuVd7a0",

    authDomain:
    "sweety-masala.firebaseapp.com",

    projectId:
    "sweety-masala",

    storageBucket:
    "sweety-masala.firebasestorage.app",

    messagingSenderId:
    "152835150862",

    appId:
    "1:152835150862:web:bdd6bafcc074aeb37e585f",

    measurementId:
    "G-NQ82YZCKG3"

};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);


onAuthStateChanged(auth, function(user){

    const userArea =
    document.getElementById("userArea");

    if(!userArea){
        return;
    }


    if(user){

        userArea.innerHTML = `

            <div class="user-area">

                <span class="user-email">
                    👤 ${user.email}
                </span>

                <button
                    type="button"
                    class="logout-btn"
                    id="logoutButton"
                >
                    🚪 Logout
                </button>

            </div>

        `;


        document
        .getElementById("logoutButton")
        .addEventListener("click", async function(){

            try{

                await signOut(auth);

                alert("✅ Logout successful!");

                window.location.href = "index.html";

            }
            catch(error){

                console.error(error);

                alert(
                    "Logout nahi ho paya. Dobara try karein."
                );

            }

        });

    }
    else{

        userArea.innerHTML = `

            <a
                href="login.html"
                class="login-link"
            >
                👤 Login
            </a>

        `;

    }

});

</script>

</body>

</html>
