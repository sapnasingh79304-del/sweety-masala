<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | Sweety Masala</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff8ed;
            color: #333;
        }

        header {
            background: #8b0000;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 15px;
        }

        .cart-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.12);
        }

        .cart-item {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item h3 {
            color: #8b0000;
            margin-bottom: 8px;
        }

        .cart-item p {
            margin: 5px 0;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            border: none;
            background: #8b0000;
            color: white;
            border-radius: 6px;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity span {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .item-total {
            font-weight: bold;
            color: #8b0000;
        }

        .remove-btn {
            border: none;
            background: #d32f2f;
            color: white;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 20px;
        }

        .empty-cart h2 {
            margin-bottom: 15px;
            color: #8b0000;
        }

        .total-box {
            text-align: right;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #8b0000;
        }

        .total-box h2 {
            color: #8b0000;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            padding: 13px 20px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .continue-btn {
            background: #555;
            color: white;
        }

        .checkout-btn {
            background: #8b0000;
            color: white;
        }

        @media (max-width: 700px) {

            .cart-item {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .item-total {
                font-size: 18px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>🌶️ Sweety Masala</h1>

    <p>Shopping Cart</p>

</header>



<div class="container">

    <div class="cart-box">

        <div id="cart-items"></div>


        <div class="total-box">

            <h2>
                Total: ₹<span id="cart-total">0</span>
            </h2>

        </div>


        <div class="buttons">

            <a
                href="products.html"
                class="btn continue-btn">

                ← Continue Shopping

            </a>


            <a
                href="checkout.html"
                class="btn checkout-btn">

                Proceed to Checkout →

            </a>

        </div>

    </div>

</div>



<script>


// =====================================
// CART DATA
// =====================================

let cart =
    JSON.parse(
        localStorage.getItem("sweetyCart")
    ) || [];



// =====================================
// DISPLAY CART
// =====================================

function displayCart() {

    const cartItems =
        document.getElementById("cart-items");

    const cartTotal =
        document.getElementById("cart-total");


    cartItems.innerHTML = "";


    // Empty cart

    if (cart.length === 0) {

        cartItems.innerHTML = `

            <div class="empty-cart">

                <h2>🛒 Cart खाली है</h2>

                <p>
                    Products page से अपना product add करें।
                </p>

                <br>

                <a
                    href="products.html"
                    class="btn checkout-btn">

                    Products देखें

                </a>

            </div>

        `;

        cartTotal.textContent = "0";

        return;
    }



    let total = 0;



    cart.forEach(function(item, index) {

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.quantity) || 1;


        const itemTotal =
            price * quantity;


        total += itemTotal;



        const cartItem =
            document.createElement("div");


        cartItem.className =
            "cart-item";


        cartItem.innerHTML = `

            <div>

                <h3>
                    ${item.name}
                </h3>

                <p>
                    Size:
                    <strong>
                        ${item.size}
                    </strong>
                </p>

                <p>
                    Price:
                    ₹${price}
                </p>

            </div>



            <div class="quantity">

                <button
                    onclick="decreaseQuantity(${index})">

                    −

                </button>


                <span>
                    ${quantity}
                </span>


                <button
                    onclick="increaseQuantity(${index})">

                    +

                </button>

            </div>



            <div class="item-total">

                ₹${itemTotal}

            </div>



            <button
                class="remove-btn"
                onclick="removeItem(${index})">

                ❌ Remove

            </button>

        `;


        cartItems.appendChild(cartItem);

    });


    cartTotal.textContent =
        total;

}



// =====================================
// INCREASE QUANTITY
// =====================================

function increaseQuantity(index) {

    cart[index].quantity =
        (Number(cart[index].quantity) || 1) + 1;


    saveCart();

}



// =====================================
// DECREASE QUANTITY
// =====================================

function decreaseQuantity(index) {

    cart[index].quantity =
        (Number(cart[index].quantity) || 1) - 1;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart();

}



// =====================================
// REMOVE PRODUCT
// =====================================

function removeItem(index) {

    cart.splice(index, 1);

    saveCart();

}



// =====================================
// SAVE CART
// =====================================

function saveCart() {

    localStorage.setItem(
        "sweetyCart",
        JSON.stringify(cart)
    );


    displayCart();

}



// =====================================
// LOAD CART
// =====================================

displayCart();


</script>


</body>

</html>
