document.getElementById(

);

const submitReturnButton =
document.getElementById(

/* =====================================================

===================================================== */

const statuses = [

    "New",

];



/* =====================================================
   CURRENT RETURN ORDER
===================================================== */

let selectedReturnOrderId = "";



/* =====================================================
   MESSAGES
===================================================== */

function clearMessages(){

    errorMessage.style.display =
    "none";

    successMessage.style.display =
    "none";

    loadingMessage.style.display =
    "none";

}


function showError(message){

    clearMessages();

    errorMessage.textContent =
    "❌ " + message;

    errorMessage.style.display =
    "block";

}


function showSuccess(message){

    clearMessages();

    successMessage.textContent =
    "✅ " + message;

    successMessage.style.display =
    "block";

}



/* =====================================================
   DATE
===================================================== */

function formatDate(timestamp){

    if(!timestamp){

        return "Date available nahi hai";

    }


    try{

        let date;


        if(
            typeof timestamp.toDate ===
            "function"
        ){

            date =
            timestamp.toDate();

        }
        else{

            date =
            new Date(timestamp);

        }


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "Date available nahi hai";

        }


        return date.toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch(error){

        return "Date available nahi hai";

    }

}



/* =====================================================
   NORMALIZE STATUS
===================================================== */

function normalizeStatus(status){

    return String(
        status || "New"
    )
    .trim()
    .toLowerCase();

}



/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    const value =
    normalizeStatus(
        status
    );


    if(value === "new")
        return "status-new";

    if(value === "accepted")
        return "status-accepted";

    if(value === "preparing")
        return "status-preparing";

    if(value === "shipped")
        return "status-shipped";

    if(value === "delivered")
        return "status-delivered";

    if(value === "cancelled")
        return "status-cancelled";

    if(
        value.includes("return")
    )
        return "status-return";

    return "status-new";

}



/* =====================================================
   CAN CANCEL?
===================================================== */

function canCancel(status){

    const value =
    normalizeStatus(
        status
    );


    return [

        "new",
        "accepted",
        "preparing"

    ].includes(
        value
    );

}



/* =====================================================
   CAN RETURN?
===================================================== */

function canReturn(status){

    return normalizeStatus(
        status
    ) === "delivered";

}



/* =====================================================
   RETURN ALREADY STARTED?
===================================================== */

function hasReturnRequest(data){

    const returnStatus =
    String(
        data.returnStatus || ""
    )
    .trim();


    return (
        returnStatus !== ""
    );

}



/* =====================================================
   STATUS TRACKER
===================================================== */

function createStatusTracker(status){

    const normalized =
    normalizeStatus(
        status
    );


    let currentIndex =
    statuses.findIndex(
        function(item){

            return normalizeStatus(
                item
            ) === normalized;

        }
    );


    if(currentIndex < 0){

        currentIndex = 0;

    }


    const wrapper =
    document.createElement(
        "div"
    );

    wrapper.className =
    "status-tracker";


    statuses.forEach(
        function(statusName,index){

            const step =
            document.createElement(
                "div"
            );

            step.className =
            "status-step";


            if(index < currentIndex){

                step.classList.add(
                    "completed"
                );

            }


            if(index === currentIndex){

                step.classList.add(
                    "current"
                );

            }


            const circle =
            document.createElement(
                "div"
            );

            circle.className =
            "status-circle";

            circle.textContent =
            index + 1;


            const name =
            document.createElement(
                "div"
            );

            name.className =
            "status-name";

            name.textContent =
            statusName;


            const line =
            document.createElement(
                "div"
            );

            line.className =
            "status-line";


            step.appendChild(
                circle
            );

            step.appendChild(
                name
            );

            step.appendChild(
                line
            );


            wrapper.appendChild(
                step
            );

        }
    );


    return wrapper;

}



/* =====================================================
   SHOW ITEMS
===================================================== */

function createItems(items){

    const wrapper =
    document.createElement(
        "div"
    );


    if(
        !Array.isArray(items) ||
        items.length === 0
    ){

        wrapper.textContent =
        "Order items available nahi hain.";

        return wrapper;

    }


    items.forEach(
        function(item){

            const row =
            document.createElement(
                "div"
            );

            row.className =
            "order-item";


            const left =
            document.createElement(
                "div"
            );


            const name =
            document.createElement(
                "div"
            );

            name.className =
            "item-name";

            name.textContent =
            item.name ||
            "Product";


            const info =
            document.createElement(
                "div"
            );

            info.className =
            "item-info";

            info.textContent =

                "Size: " +
                (
                    item.size ||
                    "-"
                ) +

                " | Qty: " +

                (
                    Number(
                        item.quantity
                    ) || 1
                );


            left.appendChild(
                name
            );

            left.appendChild(
                info
            );


            const price =
            document.createElement(
                "div"
            );

            price.className =
            "item-price";


            const itemPrice =
            Number(
                item.price
            ) || 0;


            const quantity =
            Math.max(
                1,
                Number(
                    item.quantity
                ) || 1
            );


            price.textContent =
            "₹" +
            Math.round(
                itemPrice *
                quantity
            );


            row.appendChild(
                left
            );

            row.appendChild(
                price
            );


            wrapper.appendChild(
                row
            );

        }
    );


    return wrapper;

}



/* =====================================================
   CANCEL ORDER
===================================================== */

async function cancelOrder(
    orderId,
    status
){

    if(
        !canCancel(
            status
        )
    ){

        showError(
            "Is stage par order cancel nahi kiya ja sakta."
        );

        return;

    }


    const confirmCancel =
    confirm(

        "Kya aap Order ID " +
        orderId +
        " ko cancel karna chahte hain?"

    );


    if(!confirmCancel){

        return;

    }


    try{

        clearMessages();


        loadingMessage.textContent =
        "⏳ Order cancel ho raha hai...";


        loadingMessage.style.display =
        "block";


        const orderRef =
        doc(
            db,
            "orders",
            orderId
        );


        await updateDoc(

            orderRef,

            {

                status:
                "Cancelled",

                cancelledBy:
                "Customer",

                cancelledAt:
                serverTimestamp()

            }

        );


        showSuccess(
            "Order successfully cancel kar diya gaya hai."
        );


        await loadOrders(
            phoneInput.value.trim()
        );

    }
    catch(error){

        console.error(
            "CANCEL ERROR:",
            error
        );


        showError(

            "Order cancel nahi hua. " +
            "Firebase Rules check karein."

        );

    }

}



/* =====================================================
   OPEN RETURN MODAL
===================================================== */

function openReturnModal(
    orderId
){

    selectedReturnOrderId =
    orderId;


    returnModalOrderId.textContent =
    "Order ID: " +
    orderId;


    returnReason.value =
    "";


    returnDetails.value =
    "";


    returnModal.style.display =
    "block";

}



/* =====================================================
   CLOSE RETURN MODAL
===================================================== */

function closeReturnModal(){

    returnModal.style.display =
    "none";


    selectedReturnOrderId =
    "";

}



/* =====================================================
   SUBMIT RETURN
===================================================== */

async function submitReturn(){

    if(
        !selectedReturnOrderId
    ){

        showError(
            "Order select nahi hua."
        );

        closeReturnModal();

        return;

    }


    const reason =
    returnReason.value.trim();


    const details =
    returnDetails.value.trim();


    if(!reason){

        alert(
            "Please return reason select karein."
        );

        return;

    }


    const confirmed =
    confirm(

        "Kya aap is order ke liye return request submit karna chahte hain?"

    );


    if(!confirmed){

        return;

    }


    submitReturnButton.disabled =
    true;


    submitReturnButton.textContent =
    "⏳ Submitting...";


    try{

        const orderRef =
        doc(
            db,
            "orders",
            selectedReturnOrderId
        );


        await updateDoc(

            orderRef,

            {

                returnStatus:
                "Return Requested",

                returnReason:
                reason,

                returnDetails:
                details,

                returnRequestedAt:
                serverTimestamp(),

                returnRequestedBy:
                "Customer"

            }

        );


        closeReturnModal();


        showSuccess(
            "Return request successfully submit ho gayi hai."
        );


        await loadOrders(
            phoneInput.value.trim()
        );

    }
    catch(error){

        console.error(
            "RETURN ERROR:",
            error
        );


        showError(

            "Return request submit nahi hui. " +
            "Firebase Rules check karein."

        );

    }
    finally{

        submitReturnButton.disabled =
        false;


        submitReturnButton.textContent =
        "↩️ Return Request Submit Karein";

    }

}



/* =====================================================
   CREATE ORDER CARD
===================================================== */

function createOrderCard(
    order
){

    const data =
    order.data;


    const orderId =
    order.id;


    const status =
    data.status ||
    "New";


    const card =
    document.createElement(
        "div"
    );

    card.className =
    "order-card";


    /* =================================================
       TOP
    ================================================= */

    const top =
    document.createElement(
        "div"
    );

    top.className =
    "order-top";


    const idArea =
    document.createElement(
        "div"
    );


    const idText =
    document.createElement(
        "div"
    );

    idText.className =
    "order-id";

    idText.textContent =
    "🧾 " + orderId;


    const date =
    document.createElement(
        "div"
    );

    date.className =
    "order-date";

    date.textContent =
    "📅 " +
    formatDate(
        data.createdAt
    );


    idArea.appendChild(
        idText
    );

    idArea.appendChild(
        date
    );


    const badge =
    document.createElement(
        "div"
    );

    badge.className =
    "status-badge " +
    getStatusClass(
        status
    );

    badge.textContent =
    status;


    top.appendChild(
        idArea
    );

    top.appendChild(
        badge
    );


    card.appendChild(
        top
    );



    /* =================================================
       CUSTOMER
    ================================================= */

    const customer =
    document.createElement(
        "div"
    );

    customer.className =
    "customer-info";


    const customerName =
    document.createElement(
        "p"
    );

    customerName.innerHTML =
    "<span class='customer-label'>Name:</span> " +
    (
        data.customerName ||
        "-"
    );


    const phone =
    document.createElement(
        "p"
    );

    phone.innerHTML =
    "<span class='customer-label'>Mobile:</span> " +
    (
        data.customerPhone ||
        "-"
    );


    const city =
    document.createElement(
        "p"
    );

    city.innerHTML =
    "<span class='customer-label'>City:</span> " +
    (
        data.customerCity ||
        "-"
    );


    customer.appendChild(
        customerName
    );

    customer.appendChild(
        phone
    );

    customer.appendChild(
        city
    );


    card.appendChild(
        customer
    );



    /* =================================================
       STATUS TRACKER
    ================================================= */

    if(
        normalizeStatus(
            status
        ) !== "cancelled"
    ){

        card.appendChild(
            createStatusTracker(
                status
            )
        );

    }



    /* =================================================
       ITEMS
    ================================================= */

    const title =
    document.createElement(
        "div"
    );

    title.className =
    "items-title";

    title.textContent =
    "🛒 Order Items";


    card.appendChild(
        title
    );


    card.appendChild(
        createItems(
            data.items || []
        )
    );



    /* =================================================
       TOTAL
    ================================================= */

    const total =
    document.createElement(
        "div"
    );

    total.className =
    "order-total";

    total.textContent =
    "Total: ₹" +
    Math.round(
        Number(
            data.total
        ) || 0
    );


    card.appendChild(
        total
    );



    /* =================================================
       ACTION AREA
    ================================================= */

    const actionArea =
    document.createElement(
        "div"
    );

    actionArea.className =
    "action-area";



    /* =================================================
       CANCEL BUTTON
    ================================================= */

    if(
        canCancel(
            status
        )
    ){

        const cancelButton =
        document.createElement(
            "button"
        );

        cancelButton.className =
        "cancel-btn";

        cancelButton.type =
        "button";

        cancelButton.textContent =
        "❌ Cancel Order";


        cancelButton.addEventListener(

            "click",

            function(){

                cancelOrder(
                    orderId,
                    status
                );

            }

        );


        actionArea.appendChild(
            cancelButton
        );


        const info =
        document.createElement(
            "div"
        );

        info.className =
        "action-info";

        info.textContent =
        "Aap New, Accepted aur Preparing stage mein order cancel kar sakte hain.";

        actionArea.appendChild(
            info
        );

    }
    else
    if(
        normalizeStatus(
            status
        ) === "shipped"
    ){

        const info =
        document.createElement(
            "div"
        );

        info.className =
        "action-info";

        info.textContent =
        "🚚 Order shipped ho chuka hai, isliye ab customer cancellation nahi kar sakta.";

        actionArea.appendChild(
            info
        );

    }
    else
    if(
        normalizeStatus(
            status
        ) === "cancelled"
    ){

        const info =
        document.createElement(
            "div"
        );

        info.className =
        "action-info";

        info.textContent =
        "❌ Ye order cancel ho chuka hai.";

        actionArea.appendChild(
            info
        );

    }



    /* =================================================
       RETURN
    ================================================= */

    if(
        canReturn(
            status
        )
    ){

        if(
            !hasReturnRequest(
                data
            )
        ){

            const returnButton =
            document.createElement(
                "button"
            );

            returnButton.className =
            "return-btn";

            returnButton.type =
            "button";

            returnButton.textContent =
            "↩️ Return Order";


            returnButton.addEventListener(

                "click",

                function(){

                    openReturnModal(
                        orderId
                    );

                }

            );


            actionArea.appendChild(
                returnButton
            );


            const info =
            document.createElement(
                "div"
            );

            info.className =
            "action-info";

            info.textContent =
            "Product delivered hone ke baad hi return request ki ja sakti hai.";

            actionArea.appendChild(
                info
            );

        }

    }



    /* =================================================
       RETURN STATUS
    ================================================= */

    if(
        hasReturnRequest(
            data
        )
    ){

        const returnBox =
        document.createElement(
            "div"
        );

        returnBox.className =
        "return-status-box";


        const returnTitle =
        document.createElement(
            "div"
        );

        returnTitle.className =
        "return-status-title";

        returnTitle.textContent =
        "↩️ Return Status";


        const returnText =
        document.createElement(
            "div"
        );

        returnText.className =
        "return-status-text";


        returnText.innerHTML =

            "<strong>Status:</strong> " +

            (
                data.returnStatus ||
                "Return Requested"
            ) +

            "<br><br>" +

            "<strong>Reason:</strong> " +

            (
                data.returnReason ||
                "-"
            );


        if(
            data.returnDetails
        ){

            returnText.innerHTML +=

                "<br><br><strong>Details:</strong> " +

                data.returnDetails;

        }


        returnBox.appendChild(
            returnTitle
        );

        returnBox.appendChild(
            returnText
        );


        actionArea.appendChild(
            returnBox
        );

    }



    if(
        actionArea.children.length > 0
    ){

        card.appendChild(
            actionArea
        );

    }


    return card;

}



/* =====================================================
   LOAD ALL ORDERS
===================================================== */

async function loadOrders(
    phone
){

    clearMessages();


    ordersBox.style.display =
    "none";


    ordersList.innerHTML =
    "";


    if(
        !/^[0-9]{10}$/.test(
            phone
        )
    ){

        showError(
            "Please valid 10 digit mobile number likhein."
        );

        return;

    }


    trackButton.disabled =
    true;


    trackButton.textContent =
    "⏳ Searching...";


    loadingMessage.textContent =
    "⏳ Aapke saare orders search ho rahe hain...";


    loadingMessage.style.display =
    "block";


    try{

        const ordersRef =
        collection(
            db,
            "orders"
        );


        const ordersQuery =
        query(

            ordersRef,

            where(
                "customerPhone",
                "==",
                phone
            )

        );


        const snapshot =
        await getDocs(
            ordersQuery
        );


        const orders = [];


        snapshot.forEach(
            function(docSnap){

                orders.push({

                    id:
                    docSnap.id,

                    data:
                    docSnap.data()

                });

            }
        );


        /* =================================================
           SORT LATEST FIRST
        ================================================= */

        orders.sort(
            function(a,b){

                const aTime =
                a.data.createdAt &&
                typeof a.data.createdAt.toMillis ===
                "function"

                ?
                a.data.createdAt.toMillis()

                :
                0;


                const bTime =
                b.data.createdAt &&
                typeof b.data.createdAt.toMillis ===
                "function"

                ?
                b.data.createdAt.toMillis()

                :
                0;


                return bTime - aTime;

            }
        );



        if(
            orders.length === 0
        ){

            ordersBox.style.display =
            "block";


            orderCount.textContent =
            "0 Orders";


            ordersList.innerHTML = `

                <div class="empty-orders">

                    <h3>
                        📦 Koi order nahi mila
                    </h3>

                    <p>
                        Is mobile number se abhi koi order nahi mila.
                    </p>

                </div>

            `;


            clearMessages();


            return;

        }



        /* =================================================
           SHOW ORDERS
        ================================================= */

        orders.forEach(
            function(order){

                ordersList.appendChild(

                    createOrderCard(
                        order
                    )

                );

            }
        );


        orderCount.textContent =
        orders.length +
        (
            orders.length === 1
            ?
            " Order"
            :
            " Orders"
        );


        ordersBox.style.display =
        "block";


        clearMessages();


        ordersBox.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

    }
    catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        showError(

            "Orders load nahi hue. " +
            "Firebase Firestore Rules check karein."

        );

    }
    finally{

        trackButton.disabled =
        false;


        trackButton.textContent =
        "🔍 Mere Saare Orders Dikhao";

    }

}

        );

    }

);



/* =====================================================
   PHONE INPUT
===================================================== */

phoneInput.addEventListener(

    "input",

    function(){

        this.value =
        this.value
        .replace(
            /[^0-9]/g,
            ""
        )
        .slice(
            0,
            10
        );

    }

);



/* =====================================================
   ENTER KEY
===================================================== */

phoneInput.addEventListener(

    "keydown",

    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            loadOrders(
                phoneInput.value.trim()
            );

        }

    }

);



/* =====================================================

===================================================== */

submitReturnButton.addEventListener(

);


closeReturnButton.addEventListener(

);
