<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Sweety Masala</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff8ed;
    color:#333;
}

header{
    background:#8b0000;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin-bottom:5px;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:15px;
}

.box{
    background:white;
    padding:22px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.box h2{
    color:#8b0000;
    margin-bottom:18px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.payment{
    background:#fff4d6;
    border:1px solid #e2c766;
    padding:15px;
    border-radius:8px;
}

.order-item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:14px 0;
    border-bottom:1px solid #ddd;
}

.order-price{
    font-weight:bold;
    color:#8b0000;
}

.order-total{
    text-align:right;
    margin-top:20px;
    color:#8b0000;
}

.minimum{
    text-align:right;
    margin-top:8px;
    font-weight:bold;
}

.place-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:8px;
    background:#8b0000;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.place-btn:hover{
    background:#a50000;
}

.place-btn:disabled{
    background:#777;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.error{
    background:#ffe5e5;
    color:#a00000;
}

.success{
    background:#e5f8e8;
    color:#08751c;
}

.loading{
    background:#fff4d6;
    color:#8b0000;
}

.empty{
    text-align:center;
    padding:30px;
}

.back-btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 20px;
    background:#555;
    color:white;
    text-decoration:none;
    border-radius:7px;
}

@media(max-width:600px){

    .container{
        padding:10px;
    }

    .box{
        padding:17px;
    }

    .order-item{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<header>

<h1>
🌶️ Sweety Masala
</h1>

<p>
Checkout
</p>

</header>



<div class="container">


<div
    id="errorMessage"
    class="message error">
</div>


<div
    id="loadingMessage"
    class="message loading">
</div>


<div
    id="successMessage"
    class="message success">

🎉 Order successfully placed!

<br>

WhatsApp open ho raha hai...

</div>



<!-- CUSTOMER DETAILS -->

<div class="box">

<h2>
👤 Customer Details
</h2>


<div class="form-group">

<label>
Name *
</label>

<input
    type="text"
    id="customerName"
    placeholder="Apna naam likhein">

</div>


<div class="form-group">

<label>
Mobile Number *
</label>

<input
    type="tel"
    id="customerPhone"
    placeholder="10 digit mobile number"
    maxlength="10"
    inputmode="numeric">

</div>


<div class="form-group">

<label>
Full Address *
</label>

<textarea
    id="customerAddress"
    placeholder="House No., Street, Village/Area..."></textarea>

</div>


<div class="form-group">

<label>
City *
</label>

<input
    type="text"
    id="customerCity"
    placeholder="City">

</div>


<div class="form-group">

<label>
PIN Code *
</label>

<input
    type="text"
    id="customerPin"
    placeholder="6 digit PIN code"
    maxlength="6"
    inputmode="numeric">

</div>

</div>



<!-- PAYMENT -->

<div class="box">

<h2>
💳 Payment Method
</h2>


<div class="payment">

<label>

<input
    type="radio"
    name="payment"
    value="Cash on Delivery"
    checked>

Cash on Delivery (COD)

</label>


<p style="margin-top:8px;">

Payment delivery ke time ki jayegi.

</p>

</div>

</div>



<!-- ORDER -->

<div class="box">

<h2>
🛒 Your Order
</h2>


<div id="orderItems"></div>


<div class="order-total">

<h2>

Total: ₹

<span id="orderTotal">
0
</span>

</h2>

</div>


<div class="minimum">

Minimum Order: ₹399

</div>

</div>



<!-- PLACE ORDER -->

<div class="box">

<button
    id="placeOrderBtn"
    class="place-btn"
    type="button">

✅ Place Order

</button>

</div>


</div>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const firebaseConfig = {

    apiKey:
    "AIzaSyCl15UMUZUhnfAAHWjtyR52APgLTuVd7a0",

    authDomain:
    "sweety-masala.firebaseapp.com",

    projectId:
    "sweety-masala",

    storageBucket:
    "sweety-masala.firebasestorage.app",

    messagingSenderId:
    "152835150862",

    appId:
    "1:152835150862:web:bdd6bafcc074aeb37e585f",

    measurementId:
    "G-NQ82YZCKG3"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);



/* =====================================================
   CART
===================================================== */

let cart = [];


try{

    cart =
    JSON.parse(
        localStorage.getItem(
            "sweetyCart"
        )
    ) || [];

}
catch(error){

    cart = [];

}


if(!Array.isArray(cart)){

    cart = [];

}



/* =====================================================
   ELEMENTS
===================================================== */

const orderItems =
document.getElementById(
    "orderItems"
);


const orderTotal =
document.getElementById(
    "orderTotal"
);


const placeOrderBtn =
document.getElementById(
    "placeOrderBtn"
);


const errorMessage =
document.getElementById(
    "errorMessage"
);


const loadingMessage =
document.getElementById(
    "loadingMessage"
);


const successMessage =
document.getElementById(
    "successMessage"
);



/* =====================================================
   PRODUCT ID
   SAME AS products.html
===================================================== */

function productId(name){

    return String(name || "")
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-|-$/g,
            ""
        );

}



/* =====================================================
   SIZE TO KG
===================================================== */

function sizeToKg(size){

    const value =
    String(size || "")
    .toUpperCase();


    if(value.includes("250 GM"))
        return 0.25;


    if(value.includes("500 GM"))
        return 0.50;


    if(value.includes("1 KG"))
        return 1;


    if(value.includes("2 KG"))
        return 2;


    if(value.includes("3 KG"))
        return 3;


    if(value.includes("4 KG"))
        return 4;


    if(value.includes("5 KG"))
        return 5;


    if(value.includes("10 KG"))
        return 10;


    if(value.includes("15 KG"))
        return 15;


    if(value.includes("20 KG"))
        return 20;


    if(value.includes("25 KG"))
        return 25;


    if(value.includes("30 KG"))
        return 30;


    return 1;

}



/* =====================================================
   STOCK
===================================================== */

function isInStock(data){

    /*
       Firebase document na ho
       to product IN STOCK maana jayega.
    */


    if(!data){

        return true;

    }


    /*
       Admin Panel ka actual field:
       inStock
    */


    if(
        data.inStock === false ||
        data.inStock === "false" ||
        data.inStock === 0 ||
        data.inStock === "0"
    ){

        return false;

    }


    /*
       Stock 0
    */

    if(
        data.stock === 0 ||
        data.stock === "0"
    ){

        return false;

    }


    /*
       Status
    */

    if(
        typeof data.status === "string"
    ){

        const status =
        data.status
        .trim()
        .toLowerCase();


        if(
            status === "out of stock" ||
            status === "outofstock" ||
            status === "out_of_stock"
        ){

            return false;

        }

    }


    return true;

}



/* =====================================================
   GET LATEST PRODUCT
===================================================== */

async function getLatestProduct(item){

    const name =
    item.name;


    /*
       Cart price is fallback price.
    */

    const cartPrice =
    Number(
        item.price
    ) || 0;


    const id =
    productId(
        name
    );


    try{

        const productRef =
        doc(
            db,
            "products",
            id
        );


        const snap =
        await getDoc(
            productRef
        );


        /*
           =========================================
           IMPORTANT FIX
           =========================================

           Firebase me document nahi hai,
           to error nahi dena.

           products.html ka cart price use karna.
        */

        if(
            !snap.exists()
        ){

            return {

                name:name,

                size:
                item.size || "1 KG",

                price:
                cartPrice,

                quantity:
                Math.max(
                    1,
                    Number(
                        item.quantity
                    ) || 1
                )

            };

        }


        const data =
        snap.data();



        /*
           STOCK
        */

        if(
            !isInStock(data)
        ){

            throw new Error(

                name +
                " abhi Out of Stock hai."

            );

        }



        /*
           FIREBASE PRICE
        */

        const firebasePrice =
        Number(
            data.price
        );


        /*
           Firebase price valid hai
           to wahi use hoga.
        */

        if(
            Number.isFinite(
                firebasePrice
            ) &&
            firebasePrice >= 0
        ){

            const kg =
            sizeToKg(
                item.size
            );


            return {

                name:name,

                size:
                item.size || "1 KG",

                price:
                Math.round(
                    firebasePrice * kg
                ),

                quantity:
                Math.max(
                    1,
                    Number(
                        item.quantity
                    ) || 1
                )

            };

        }



        /*
           Firebase document hai
           lekin price nahi hai.

           Cart ka price use karo.
        */

        return {

            name:name,

            size:
            item.size || "1 KG",

            price:
            cartPrice,

            quantity:
            Math.max(
                1,
                Number(
                    item.quantity
                ) || 1
            )

        };

    }
    catch(error){

        /*
           Agar Firebase permission/network
           problem hai to asli error throw karo.

           Product missing ko upar already handle
           kiya ja chuka hai.
        */

        throw error;

    }

}



/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(){

    orderItems.innerHTML =
    "";


    if(
        cart.length === 0
    ){

        orderItems.innerHTML = `

            <div class="empty">

                <h3>
                    🛒 Cart empty hai
                </h3>

                <a
                    href="products.html"
                    class="back-btn">

                    Products par jayein

                </a>

            </div>

        `;


        orderTotal.textContent =
        "0";


        placeOrderBtn.disabled =
        true;


        return;

    }


    let total = 0;


    cart.forEach(
        function(item){

            const price =
            Number(
                item.price
            ) || 0;


            const quantity =
            Math.max(
                1,
                Number(
                    item.quantity
                ) || 1
            );


            const itemTotal =
            price *
            quantity;


            total +=
            itemTotal;


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "order-item";


            div.innerHTML = `

                <div>

                    <strong>
                        ${item.name || "Product"}
                    </strong>

                    <br>

                    Size:
                    ${item.size || "-"}

                    <br>

                    Quantity:
                    ${quantity}

                </div>


                <div class="order-price">

                    ₹${itemTotal}

                </div>

            `;


            orderItems.appendChild(
                div
            );

        }
    );


    orderTotal.textContent =
    Math.round(
        total
    );

}



/* =====================================================
   MESSAGES
===================================================== */

function clearMessages(){

    errorMessage.style.display =
    "none";

    loadingMessage.style.display =
    "none";

    successMessage.style.display =
    "none";

}


function showError(message){

    clearMessages();


    errorMessage.textContent =
    "❌ " + message;


    errorMessage.style.display =
    "block";

}



/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder(){

    clearMessages();


    const name =
    document
    .getElementById(
        "customerName"
    )
    .value
    .trim();


    const phone =
    document
    .getElementById(
        "customerPhone"
    )
    .value
    .trim();


    const address =
    document
    .getElementById(
        "customerAddress"
    )
    .value
    .trim();


    const city =
    document
    .getElementById(
        "customerCity"
    )
    .value
    .trim();


    const pin =
    document
    .getElementById(
        "customerPin"
    )
    .value
    .trim();



    /* VALIDATION */

    if(!name){

        showError(
            "Please apna naam likhein."
        );

        return;

    }


    if(
        !/^[0-9]{10}$/.test(
            phone
        )
    ){

        showError(
            "Please valid 10 digit mobile number likhein."
        );

        return;

    }


    if(!address){

        showError(
            "Please apna address likhein."
        );

        return;

    }


    if(!city){

        showError(
            "Please city likhein."
        );

        return;

    }


    if(
        !/^[0-9]{6}$/.test(
            pin
        )
    ){

        showError(
            "Please valid 6 digit PIN code likhein."
        );

        return;

    }


    if(
        cart.length === 0
    ){

        showError(
            "Cart empty hai."
        );

        return;

    }



    placeOrderBtn.disabled =
    true;


    placeOrderBtn.textContent =
    "⏳ Checking...";


    loadingMessage.textContent =
    "⏳ Latest price aur stock check ho raha hai...";


    loadingMessage.style.display =
    "block";



    try{


        /* =============================================
           FIREBASE VERIFICATION
        ============================================= */

        const verifiedItems = [];


        for(
            const item of cart
        ){

            const product =
            await getLatestProduct(
                item
            );


            verifiedItems.push(
                product
            );

        }



        /* =============================================
           TOTAL
        ============================================= */

        let total = 0;


        verifiedItems.forEach(
            function(item){

                total +=
                item.price *
                item.quantity;

            }
        );


        total =
        Math.round(
            total
        );



        /* =============================================
           MINIMUM ORDER
        ============================================= */

        if(
            total < 399
        ){

            placeOrderBtn.disabled =
            false;


            placeOrderBtn.textContent =
            "✅ Place Order";


            showError(

                "Minimum order ₹399 ka hai. " +
                "Current total ₹" +
                total +
                " hai."

            );


            return;

        }



        /* =============================================
           SAVE UPDATED CART
        ============================================= */

        localStorage.setItem(

            "sweetyCart",

            JSON.stringify(
                verifiedItems
            )

        );



        /* =============================================
           WHATSAPP MESSAGE
        ============================================= */

        let message = "";


        message +=
        "🌶️ SWEETY MASALA ORDER\n";


        message +=
        "====================\n\n";


        message +=
        "👤 Customer: " +
        name +
        "\n";


        message +=
        "📱 Mobile: " +
        phone +
        "\n";


        message +=
        "🏠 Address: " +
        address +
        "\n";


        message +=
        "📍 City: " +
        city +
        "\n";


        message +=
        "📮 PIN: " +
        pin +
        "\n";


        message +=
        "💳 Payment: Cash on Delivery\n\n";


        message +=
        "🛒 ORDER DETAILS\n";


        message +=
        "--------------------\n";


        verifiedItems.forEach(
            function(item){

                const itemTotal =
                item.price *
                item.quantity;


                message +=

                item.name +
                " | Size: " +
                item.size +
                " | Qty: " +
                item.quantity +
                " | ₹" +
                itemTotal +
                "\n";

            }
        );


        message +=
        "\nTOTAL: ₹" +
        total;


        message +=
        "\n\nThank you for ordering from Sweety Masala!";



        /* =============================================
           FIREBASE ORDER
        ============================================= */

        const orderData = {

            customerName:
            name,

            customerPhone:
            phone,

            customerAddress:
            address,

            customerCity:
            city,

            customerPin:
            pin,

            paymentMethod:
            "Cash on Delivery",

            items:
            verifiedItems,

            total:
            total,

            status:
            "New",

            createdAt:
            serverTimestamp()

        };


        loadingMessage.textContent =
        "⏳ Order save ho raha hai...";


        const orderRef =
        await addDoc(

            collection(
                db,
                "orders"
            ),

            orderData

        );


        console.log(
            "Order ID:",
            orderRef.id
        );



        /* =============================================
           SUCCESS
        ============================================= */

        clearMessages();


        successMessage.style.display =
        "block";


        placeOrderBtn.disabled =
        true;


        placeOrderBtn.textContent =
        "✅ Order Placed";


        localStorage.removeItem(
            "sweetyCart"
        );



        /* =============================================
           WHATSAPP
        ============================================= */

        const whatsappNumber =
        "917488130373";


        const whatsappURL =

        "https://wa.me/" +

        whatsappNumber +

        "?text=" +

        encodeURIComponent(
            message
        );


        setTimeout(
            function(){

                window.location.href =
                whatsappURL;

            },
            1000
        );


    }
    catch(error){

        console.error(
            "CHECKOUT ERROR:",
            error
        );


        placeOrderBtn.disabled =
        false;


        placeOrderBtn.textContent =
        "✅ Place Order";


        showError(
            error.message ||
            "Order place nahi hua."
        );

    }

}



/* =====================================================
   BUTTON
===================================================== */

placeOrderBtn.addEventListener(
    "click",
    placeOrder
);



/* =====================================================
   START
===================================================== */

displayCart();


console.log(
    "Checkout loaded."
);


console.log(
    "Cart:",
    cart
);

</script>

</body>

</html>
